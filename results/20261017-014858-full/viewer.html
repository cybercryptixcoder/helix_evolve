<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helix run viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Helix run viewer. One self-contained page: the trace of a run is embedded below (TRACE), or dropped onto
  the page as a JSON file made by `python -m viz.export <run> --json trace.json`.

  How the page is organised (search for these headings to find your way around):
    STYLE            colours, type, layout
    GEOMETRY         where every machine and belt sits on the floor (edit here to move things)
    SCHEDULE         turns the trace into a timeline of parcels, cards and machine work
    FLOOR            draws the machines and moves things for a given moment
    INSPECTOR        the right-hand panel: what a call, feature, machine or generation did
    TABS             parts (every feature), champions (code and score), notes
    TRANSPORT        play, pause, speed, timeline, keyboard
  viz/README.md has the trace format and how to add a new machine or a new kind of parcel.
-->
<style>
/* ============================================================ STYLE */
:root {
  color-scheme: light;
  --floor: #E2E5E7;
  --floor-mark: #D2D7DB;
  --panel: #F8F9F9;
  --paper: #FFFFFF;
  --ink: #1E2930;
  --ink-2: #53626D;
  --ink-3: #85939C;
  --line: #B8C0C6;
  --belt: #8C979F;
  --deep: #1F5FB4;
  --deep-soft: #DDE7F6;
  --wide: #D9651C;
  --wide-soft: #FBE7D7;
  --fit: #2D7A4E;
  --fit-soft: #DBEEE2;
  --lib: #5B418F;
  --lib-soft: #E9E2F4;
  --hazard: #F1BF2A;
  --bad: #B33A3A;
  --bad-soft: #F6E0E0;
  --flat: #7B868E;
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sign: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--floor); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; }
a { color: var(--deep); }

.app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 34vw); grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; }


/* header */
.top { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 28px; padding: 14px 22px 0; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { padding-bottom: 12px; min-width: 0; }
.brand h1 { font: 700 26px/1 var(--sign); margin: 0; letter-spacing: 0.01em; }
.brand p { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; }
.tabs { display: flex; gap: 2px; margin-left: auto; align-self: flex-end; }
.tabs button { border: 0; background: none; padding: 9px 14px 11px; font: 600 15px/1 var(--sign); color: var(--ink-2); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.board { display: flex; gap: 22px; padding-bottom: 12px; }
.board div { display: flex; flex-direction: column; }
.board b { font: 600 22px/1.1 var(--sign); font-variant-numeric: tabular-nums; }
.board span { font-size: 12.5px; color: var(--ink-2); }

/* stage */
.stage { grid-column: 1; position: relative; overflow: hidden; min-height: 420px; }
.view { position: absolute; inset: 0; overflow: auto; }
.view[hidden] { display: none; }
#floor { width: 100%; height: 100%; display: block; }
.dropzone { position: absolute; inset: 24px; border: 2px dashed var(--belt); border-radius: 10px; display: grid; place-items: center; text-align: center; color: var(--ink-2); background: rgba(255,255,255,0.4); }
.dropzone h2 { font: 600 24px var(--sign); color: var(--ink); margin: 0 0 6px; }
.dropzone.over { background: var(--deep-soft); border-color: var(--deep); }
.dropzone[hidden] { display: none; }

/* floor drawing */
.stencil { font: 700 210px/1 var(--sign); fill: var(--floor-mark); }
.stencil-sub { font: 600 22px var(--sign); fill: var(--floor-mark); }
.belt { fill: none; stroke: var(--belt); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.belt.minor { stroke-dasharray: 4 5; stroke-width: 1.6; }
.belt-label { font: 500 11.5px var(--font); fill: var(--ink-3); }
.node rect.body { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.node rect.cap { stroke: none; }
.node .title { font: 700 16px var(--sign); fill: var(--paper); }
.node .sub { font: 400 12px var(--font); fill: var(--ink-2); }
.node .stat { font: 600 12.5px var(--sign); fill: var(--ink); font-variant-numeric: tabular-nums; }
.node .lamp { fill: #C9CFD3; stroke: rgba(0,0,0,0.25); }
.node.busy .lamp { fill: var(--hazard); }
.node .bar { fill: currentColor; opacity: 0.22; }
.node { cursor: pointer; }
.node:hover rect.body { stroke-width: 2.2; }
.node.sel rect.body { stroke-width: 3; }
.deep { color: var(--deep); } .wide { color: var(--wide); } .fit { color: var(--fit); } .lib { color: var(--lib); } .seed { color: var(--ink-2); } .scrapc { color: var(--bad); }
.node .cap { fill: currentColor; }
.bay rect { fill: var(--panel); stroke: var(--line); }
.bay.busy rect.bayfill { fill: currentColor; opacity: 0.18; }
.bay text { font: 500 9.5px var(--font); fill: var(--ink-2); }
.bay.busy text { fill: var(--ink); }
.tray { fill: none; stroke: var(--line); stroke-dasharray: 3 3; }
.hazard-label { font: 700 12px var(--sign); fill: var(--ink); letter-spacing: 0.04em; }
.gate-note { font: 500 11px var(--font); fill: var(--ink-2); }
.parcel { cursor: pointer; }
.parcel .env { fill: var(--paper); stroke: currentColor; stroke-width: 1.5; }
.parcel .fold { fill: none; stroke: currentColor; stroke-width: 1.1; }
.parcel .plabel, .card .clabel { font: 600 11px var(--font); fill: var(--ink); paint-order: stroke; stroke: var(--floor); stroke-width: 3.5px; stroke-linejoin: round; }
.parcel.sel .env, .card.sel .glyph { stroke-width: 3; }
.card { cursor: pointer; }
.card .glyph { fill: currentColor; stroke: rgba(0,0,0,0.45); stroke-width: 1; }
.card .glines { stroke: rgba(255,255,255,0.85); stroke-width: 1.4; }
.card .chip rect { fill: var(--paper); stroke: currentColor; stroke-width: 1.4; }
.card .chip text { font: 600 10.5px var(--font); fill: var(--ink); }
.badge circle { stroke: var(--paper); stroke-width: 1.5; }
.badge text { font: 700 9.5px var(--font); fill: var(--paper); text-anchor: middle; dominant-baseline: central; }
.b-kept circle { fill: var(--fit); } .b-bad circle { fill: var(--bad); } .b-flat circle { fill: var(--flat); } .b-good circle { fill: var(--fit); } .b-red circle { fill: var(--lib); }

/* inspector */
.inspector { grid-column: 2; grid-row: 2 / 4; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); max-height: calc(100vh - 0px); }
.insp { padding: 18px 22px 40px; }
.insp .kicker { font: 600 13px var(--sign); color: var(--ink-2); margin: 0 0 2px; }
.insp h2 { font: 700 23px/1.15 var(--sign); margin: 0 0 6px; overflow-wrap: anywhere; }
.insp h3 { font: 600 17px var(--sign); margin: 22px 0 6px; }
.insp .meta { color: var(--ink-2); font-size: 13.5px; margin: 0 0 10px; }
.insp .back { border: 0; background: none; color: var(--ink-2); padding: 0; margin: 0 0 10px; font-size: 13.5px; }
.note { background: var(--paper); border-left: 4px solid var(--lib); padding: 10px 14px; margin: 12px 0; border-radius: 0 6px 6px 0; }
.note .who { font: 600 12.5px var(--sign); color: var(--lib); margin: 0 0 3px; }
.note p { margin: 0 0 8px; } .note p:last-child { margin: 0; }
.note.auto { border-left-color: var(--ink-3); } .note.auto .who { color: var(--ink-2); }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 14px; margin: 8px 0; }
.facts dt { color: var(--ink-2); } .facts dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin: 10px 0 6px; flex-wrap: wrap; }
.seg button { border: 0; background: var(--paper); padding: 6px 12px; font-size: 13.5px; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.raw-toggle { font-size: 13px; color: var(--ink-2); margin-left: 10px; }
.scrollbox { max-height: max(320px, calc(100vh - 420px)); overflow: auto; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
@media (max-width: 1050px) { .scrollbox { max-height: 70vh; } }
.md { font-size: 14px; overflow-wrap: anywhere; }
.md h4 { font: 600 15.5px var(--sign); margin: 14px 0 4px; }
.md h4.hit { background: var(--hazard); padding: 0 4px; border-radius: 3px; }
.md p { margin: 0 0 8px; }
.md ul { margin: 0 0 8px; padding-left: 18px; }
.md code { font: 12.5px var(--mono); background: #ECEFF1; padding: 0 3px; border-radius: 3px; }
pre { font: 12.5px/1.55 var(--mono); background: #1F272D; color: #E7ECEF; padding: 11px 13px; border-radius: 6px; overflow: auto; margin: 6px 0 12px; white-space: pre; tab-size: 4; }
pre.raw { white-space: pre-wrap; background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
.tk-kw { color: #8FC1FF; } .tk-str { color: #F5C98A; } .tk-com { color: #8D9BA5; font-style: italic; } .tk-num { color: #B7E2A7; } .tk-fn { color: #F3A1C9; }
.diff .add { background: rgba(108, 196, 133, 0.22); display: block; } .diff .del { background: rgba(230, 105, 105, 0.22); display: block; color: #F0B9B9; }
.pill { display: inline-block; font: 600 12px/1.6 var(--sign); padding: 0 8px; border-radius: 10px; background: #E6EAED; color: var(--ink); white-space: nowrap; }
.v-kept { background: var(--fit); color: #fff; } .v-probe-rejected, .v-refuted, .v-invalid { background: var(--bad-soft); color: var(--bad); }
.v-flat { background: #E6EAED; color: var(--ink-2); } .v-redundant { background: var(--lib-soft); color: var(--lib); }
.v-retired { background: var(--lib); color: #fff; }
.list { list-style: none; padding: 0; margin: 6px 0; }
.list li { border-top: 1px solid #E1E5E8; padding: 7px 0; }
.list li button.link { border: 0; background: none; padding: 0; text-align: left; color: var(--ink); font-weight: 600; }
.list li button.link:hover { color: var(--deep); text-decoration: underline; }
.small { font-size: 13px; color: var(--ink-2); }
table.t { border-collapse: collapse; font-size: 13.5px; width: 100%; margin: 6px 0 12px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 600 13px var(--sign); color: var(--ink-2); border-bottom: 1px solid var(--line); padding: 4px 6px 4px 0; }
table.t td { border-bottom: 1px solid #E5E9EC; padding: 4px 6px 4px 0; vertical-align: top; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: #EEF1F3; }
.probe { display: block; margin: 6px 0 4px; }

/* transport */
.transport { grid-column: 1; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 22px 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; height: 34px; min-width: 38px; padding: 0 10px; font-weight: 600; }
.tbtn.play { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 74px; }
.speed { height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); padding: 0 6px; }
.gens { display: flex; gap: 4px; margin-left: 6px; }
.gens button { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; height: 30px; padding: 0 9px; font: 600 13.5px var(--sign); }
.gens button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.caption { margin-left: auto; color: var(--ink); font-size: 14px; min-height: 21px; text-align: right; flex: 1 1 240px; }
.track { position: relative; height: 40px; margin-top: 10px; cursor: pointer; touch-action: none; }
.track .lane { position: absolute; left: 0; right: 0; top: 14px; height: 12px; background: #E3E7EA; border-radius: 6px; }
.track .gseg { position: absolute; top: 14px; height: 12px; border-left: 2px solid var(--panel); }
.track .gseg span { position: absolute; top: -14px; left: 4px; font: 600 11px var(--sign); color: var(--ink-2); white-space: nowrap; }
.track .tick { position: absolute; width: 2px; height: 6px; border-radius: 1px; }
.track .tick.deep { background: var(--deep); top: 28px; } .track .tick.wide { background: var(--wide); top: 34px; }
.track .kept { position: absolute; top: 15px; width: 10px; height: 10px; margin-left: -5px; background: var(--fit); transform: rotate(45deg); border: 1.5px solid var(--panel); }
.track .head { position: absolute; top: 6px; width: 3px; height: 28px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
.track .done { position: absolute; left: 0; top: 14px; height: 12px; background: rgba(30, 41, 48, 0.16); border-radius: 6px 0 0 6px; }

/* parts and champions tabs */
.sheet { padding: 22px 26px 60px; max-width: 1180px; }
.sheet h2 { font: 700 26px var(--sign); margin: 0 0 4px; }
.sheet > p { color: var(--ink-2); margin: 0 0 18px; max-width: 72ch; }
.genrow { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.genrow .g { font: 700 30px/1 var(--sign); }
.genrow .g small { display: block; font: 500 12.5px var(--font); color: var(--ink-2); margin-top: 6px; }
.lanehead { font: 600 13px var(--sign); margin-bottom: 6px; }
.parts { display: flex; flex-wrap: wrap; gap: 8px; }
.part { width: 210px; text-align: left; border: 1px solid var(--line); border-left: 5px solid currentColor; background: var(--paper); border-radius: 5px; padding: 7px 9px; }
.part:hover { border-color: var(--ink); border-left-color: currentColor; }
.part b { display: block; font: 600 13.5px var(--font); color: var(--ink); overflow-wrap: anywhere; }
.part span.why { display: block; font-size: 12.5px; color: var(--ink-2); margin: 2px 0 5px; line-height: 1.35; }
.part .num { display: block; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: 3px; }
.chart { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 18px; }
.champ { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 0 0 14px; }
.champ h3 { font: 700 19px var(--sign); margin: 0 0 4px; }
.notes-body { max-width: 74ch; }
.notes-body h3 { font: 700 20px var(--sign); margin: 26px 0 6px; }
.finding { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--hazard); border-radius: 0 6px 6px 0; padding: 10px 14px; margin: 10px 0; }
.finding b { font: 600 16px var(--sign); display: block; margin-bottom: 3px; }

@media (max-width: 1050px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; height: auto; }
  .stage { height: 72vh; }
  #floor { min-width: 900px; height: auto; }
  .inspector { grid-column: 1; grid-row: auto; max-height: none; border-left: 0; border-top: 1px solid var(--line); }
  .transport { grid-row: 3; }
  .genrow { grid-template-columns: 1fr; }
  .board { gap: 14px; flex-wrap: wrap; }
  .track .gseg span { font-size: 0; }
  .track .gseg span::after { content: attr(data-short); font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Helix run viewer</h1>
      <p id="runline">Drop a trace file to begin</p>
    </div>
    <div class="board" id="board" aria-live="polite"></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" aria-selected="true" data-view="floorview">Floor</button>
      <button role="tab" aria-selected="false" data-view="partsview">Parts</button>
      <button role="tab" aria-selected="false" data-view="champview">Champions</button>
      <button role="tab" aria-selected="false" data-view="notesview">Notes</button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <section class="view" id="floorview" aria-label="Factory floor">
      <svg id="floor" viewBox="0 0 1190 790" role="img" aria-label="The two loops of the run, with messages and features moving between the agents"></svg>
    </section>
    <section class="view" id="partsview" hidden></section>
    <section class="view" id="champview" hidden></section>
    <section class="view" id="notesview" hidden></section>
    <div class="dropzone" id="dropzone" hidden>
      <div>
        <h2>Drop a run trace here</h2>
        <p>Make one with <code>python -m viz.export helix/runs/&lt;run&gt; --json trace.json</code>,<br>or build this page with the trace inside: <code>python -m viz.export helix/runs/&lt;run&gt;</code>.</p>
        <p><label class="tbtn" style="display:inline-flex;align-items:center">Choose a file<input type="file" id="filepick" accept=".json,application/json" hidden></label></p>
      </div>
    </div>
  </main>

  <aside class="inspector" id="inspector" aria-label="Details"></aside>

  <footer class="transport">
    <div class="row">
      <button class="tbtn" id="prev" title="Previous step (left arrow)" aria-label="Previous step">◀︎</button>
      <button class="tbtn play" id="play" title="Play or pause (space)">Play</button>
      <button class="tbtn" id="next" title="Next step (right arrow)" aria-label="Next step">▶︎</button>
      <select class="speed" id="speed" aria-label="Speed">
        <option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
      </select>
      <div class="gens" id="gens" aria-label="Jump to a generation"></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="track" id="track" role="slider" aria-label="Timeline" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  </footer>
</div>

ly penalise when the tight residual is small AND the loose one large, weighted by how imbalanced the item itself is.","note":"variant of _f0013 (class_match_residual)","code":"import numpy as np\nimport math\n\n\ndef feature(item, bins, capacity):\n    \"\"\"Asymmetric stranding penalty: only penalise when the tight residual is small AND the loose one large, weighted by how imbalanced the item itself is.\"\"\"\n    cap = np.asarray(capacity, dtype=float)\n    it = np.asarray(item, dtype=float)\n    r = (bins - it) / cap\n    m = np.minimum(r[:, 0], r[:, 1])\n    M = np.maximum(r[:, 0], r[:, 1])\n\n    # how lopsided the arriving job is: 0 = balanced, 1 = purely one resource\n    ic = it / cap\n    imb = np.abs(ic[0] - ic[1]) / (ic[0] + ic[1] + 1e-9)\n\n    # soft threshold: tight residual approaching 0, loose residual still substantial\n    tight_small = np.clip((0.10 - m) / 0.10, 0.0, 1.0)\n    loose_big = np.clip((M - 0.20) / 0.30, 0.0, 1.0)\n\n    # only meaningful for jobs that themselves consume mostly one resource\n    gate = 0.3 + 0.7 * imb\n\n    return -(tight_small * loose_big) * gate\n","status":"redundant","verdict":"redundant","kept_at":null,"retired_at":null,"delta_train":0.0956,"delta_valid":0.0835,"columns":["asymmetric_stranding_gate"],"weights":[0.0],"importance":null,"error":null,"gated":null,"probe":[{"w":0.4,"delta":-0.02},{"w":-0.4,"delta":-1.362},{"w":0.1,"delta":0.034},{"w":-0.1,"delta":0.022}],"timing":{"probe":1.7,"free":3.1,"refit":6.3,"valid":1.7,"total":12.7,"rejected":false,"gated":false},"calls":["c040"]},{"id":"f0035","name":"residual_bottleneck_asymmetry","branch":"wide","gen":5,"hypothesis":null,"parents":[],"description":"Asymmetry of the post-placement residual: which resource is the binding bottleneck, signed.","note":"fresh","code":"import numpy as np\n\ndef feature(item, bins, capacity):\n    \"\"\"Asymmetry of the post-placement residual: which resource is the binding bottleneck, signed.\"\"\"\n    cap = np.asarray(capacity, dtype=float)\n    it = np.asarray(item, dtype=float)\n    r = (bins - it) / np.maximum(cap, 1.0)\n    # signed difference: positive => CPU is tighter than memory after placement, negative => memory tighter\n    d = r[:, 1] - r[:, 0]\n    # scale by how tight the bin is overall so near-empty bins barely register\n    tight = np.minimum(r[:, 0], r[:, 1])\n    return np.tanh(3.0 * d) * (1.0 - np.clip(tight, 0.0, 1.0))\n","status":"rejected","verdict":"probe-rejected","kept_at":null,"retired_at":null,"delta_train":-0.2305,"delta_valid":null,"columns":["residual_bottleneck_asymmetry"],"weights":[0.0],"importance":null,"error":null,"gated":null,"probe":[{"w":0.4,"delta":-2.281},{"w":-0.4,"delta":-2.632},{"w":0.1,"delta":-0.356},{"w":-0.1,"delta":-0.231}],"timing":{"probe":1.6,"rejected":true,"gated":false},"calls":["c038"]},{"id":"f0036","name":"closing_bin_penalty_seal_weighted","branch":"wide","gen":5,"hypothesis":null,"parents":["f0031"],"description":"Post-placement residual tightness weighted by how close the bin is to being sealed (both dims small).","note":"variant of _f0031 (closing_bin_penalty)","code":"import numpy as np\nimport math\n\n\ndef feature(item, bins, capacity):\n    \"\"\"Post-placement residual tightness weighted by how close the bin is to being sealed (both dims small).\"\"\"\n    cap = np.asarray(capacity, dtype=float)\n    it = np.asarray(item, dtype=float)\n    r = (bins - it) / cap\n    tight = np.minimum(r[:, 0], r[:, 1])\n    loose = np.maximum(r[:, 0], r[:, 1])\n    # where the bin is nearly full (small tight), reward it more strongly; saturate to avoid blow-ups\n    seal = 1.0 / (tight + 0.1)\n    seal = np.minimum(seal, 6.0)\n    # mean residual, but emphasize the tight dimension (the one that will be stranded first)\n    mean_res = (2.0 * tight + loose) / 3.0\n    return -mean_res * (seal / 6.0)\n","status":"redundant","verdict":"redundant","kept_at":null,"retired_at":null,"delta_train":0.1159,"delta_valid":0.1263,"columns":["closing_bin_p parents":[],"description":"r = (bins - item)/capacity. need = item/capacity. For each bin: ratio0 = r[:,0] / (need[0] + eps), ratio1 = r[:,1] / (need[1] + eps). Return min(ratio0, ratio1) clipped to [-1, 2] / 2. I.e. how many more jobs of this exact size the bin can still take in its tight resource. Empty bin: ~1.5 (room for ","note":"I used the tight (min) of the two per-resource repeat-count ratios, clipped to [-1, 2] and halved, so the empty bin lands at ~1.5 and a just-fitting bin near 0.","code":"import numpy as np\n\ndef feature(item, bins, capacity):\n    \"\"\"Post-placement room for another same-size job, in the tight resource, scaled.\"\"\"\n    cap = np.asarray(capacity, dtype=float)\n    it = np.asarray(item, dtype=float)\n    r = (bins - it) / cap\n    need = it / cap\n    eps = 1e-6\n    ratio0 = r[:, 0] / (need[0] + eps)\n    ratio1 = r[:, 1] / (need[1] + eps)\n    m = np.minimum(ratio0, ratio1)\n    return np.clip(m, -1.0, 2.0) / 2.0\n","status":"rejected","verdict":"flat","kept_at":null,"retired_at":null,"delta_train":0.05,"delta_valid":-0.0049,"columns":["uniform_second_same_class_slot"],"weights":[0.0],"importance":null,"error":null,"gated":null,"probe":[{"w":0.4,"delta":-2.422},{"w":-0.4,"delta":-0.448},{"w":0.1,"delta":-0.139},{"w":-0.1,"delta":0.018}],"timing":{"probe":1.6,"free":3.1,"refit":4.8,"valid":1.5,"total":11.0,"rejected":false,"gated":false},"calls":["c043"]},{"id":"f0039","name":"anticorr_fourth_slot_room","branch":"deep","gen":5,"hypothesis":"h0019","parents":[],"description":"r = (bins - item)/capacity. Return min(r[:,0], r[:,1]) * (min(r[:,0], r[:,1]) > 0.2) - (1 - min(r[:,0], r[:,1])) * (min(r[:,0], r[:,1]) <= 0.2). I.e. +tight residual if the bin keeps >=20% in both resources (a 4th small job still fits), else -tight residual (closing). Empty bin: tight~0.6 -> +0.6. N","note":"I used the literal formula's `-tight` (not `-(1-tight)`) for the closing branch, since `-(1-tight)` would make nearly-full bins score near -1 but also invert ordering among closed bins; the faithful reading of \"else -tight residual\" is `-tight`.","code":"import numpy as np\n\ndef feature(item, bins, capacity):\n    \"\"\"Signed tight post-placement residual: +tight if both resources keep >=20%, else -tight.\"\"\"\n    cap = np.asarray(capacity, dtype=float)\n    r = (bins - item) / cap\n    tight = np.minimum(r[:, 0], r[:, 1])\n    open_room = tight > 0.2\n    return np.where(open_room, tight, -tight)\n","status":"redundant","verdict":"redundant","kept_at":null,"retired_at":null,"delta_train":0.0822,"delta_valid":0.0595,"columns":["anticorr_fourth_slot_room"],"weights":[0.0],"importance":null,"error":null,"gated":null,"probe":[{"w":0.4,"delta":-0.369},{"w":-0.4,"delta":-0.24},{"w":0.1,"delta":0.082},{"w":-0.1,"delta":0.049}],"timing":{"probe":1.6,"free":2.6,"refit":4.4,"valid":1.5,"total":10.1,"rejected":false,"gated":false},"calls":["c044"]},{"id":"f0040","name":"big_with_big_room_penalty","branch":"deep","gen":5,"hypothesis":"h0020","parents":[],"description":"Active only when max(item)/capacity > 0.4. r = (bins - item)/capacity (post-placement, clipped at 0). Return min(r[:,0], r[:,1]) - max(r[:,0], r[:,1]) restricted to the tight resource being large: i.e. return (r[:,0] - r[:,1]) * sign(item[0]-item[1]) * (min(r[:,0],r[:,1]) > 0.2). Empty bin: r=(1-nee","note":"I gate on `max(item)/capacity > 0.4` (using the max capacity component) and multiply the signed residual difference by the \"both resources keep >20% room\" indicator, so the empty bin (diff≈0) and closing bins score ~0.","code":"import numpy as np\n\ndef feature(item, bins, capacity):\n    \"\"\"Active for large jobs: signed residual difference when both resources keep >20% room.\"\"\"\n    cap = np.asarray(capacity, dtype=float)\n    it = np.asarray(item, dtype=float)\n    r = np.clip((bins - it) / cap, 0.0, None)\n    r0 = r[:, 0]\n    r1 = r[:, 1]\n    mn = np.minimum(r0, r1)\n    diff = r0 - r1\n    s = np.sign(it[0] - it[1])\n    active = (np.max(it) / cap.max()) > 0.4\n    gate = (mn > 0.2).astype(float)\n    val = diff * s * gate\n    if not active:\n        val = np.zeros_like(val)\n    return val\n","status":"active","verdict":"kept","kept_at":5,"retired_at":null,"delta_train":0.2644,"delta_valid":0.1606,"columns":["big_with_big_room_penalty"],"weights":[0.21796780711355637],"importance":[0.6997],"error":null,"gated":null,"probe":[{"w":0.4,"delta":0.22},{"w":-0.4,"delta":-30.874},{"w":0.1,"delta":0.096},{"w":-0.1,"delta":-0.424}],"timing":{"probe":1.9,"free":3.6,"refit":4.9,"valid":1.7,"total":12.0,"rejected":false,"gated":false},"calls":["c046"]}],"ideas":[{"id":"h0002","gen":1,"feature":"f0006","claim":"In anticorr (half CPU-heavy, half mem-heavy) the optimum builds LS+MS+SL+SM 4-job bins; champion stops at 3-job bins (262 threes, only 22 fours) because it doesn't seek bins whose leftover shape complements the arriving job's heavy resource. Reward bins whose remaining slack is on the resource the job is NOT heavy in.","measure":"r = (bins - item)/capacity; heavy = argmax(item); return r[:, 1-heavy] - r[:, heavy] (slack on the light resource minus slack on the heavy resource). Empty bin: 0 (symmetric). A bin already tight on the job's heavy side but open on the other side scores positive; the reverse scores negative.","target":"anticorr: jobs/bin 2.87 -> 3.34, 4-job bins 22 -> 105, bins 348 -> 299.","builds_on":"","verdict":"refuted","delta":null,"base":"p0001"},{"id":"h0004","gen":1,"feature":"f0008","claim":"Champion leaves 55 stranded bins in large and 104 in anticorr (vs 2 and 0 optimal): it stacks jobs that leave one resource nearly exhausted while the other stays open, so later jobs can't use the bin. A better decision prefers the bin whose post-placement residuals are balanced (neither resource left dangling), keeping bins usable for future jobs.","measure":"For each bin, r = (bins - item)/capacity after placement; return -abs(r[:,0] - r[:,1]) (negative imbalance), i.e. how evenly the two remaining resources are matched. Empty bin gives 0; a bin that would be left with CPU 0.02, mem 0.30 gives -0.28; a balanced bin gives ~0.","target":"large: stranded bins 55 -> down toward 2, and bins/job 2.29 -> up toward 2.62; anticorr: stranded 104 -> down, bins 348 -> toward 299.","builds_on":"","verdict":"refuted","delta":null,"base":"p0001"},{"id":"h0003","gen":1,"feature":"f0007","claim":"Champion packs only 2.29 jobs/bin in large while optimum reaches 2.62, and leaves 15%/13% room. It doesn't prefer the bin that will be most tightly filled; the optimal packings are dense (2LL, LL+ML). Preferring the bin whose tighter residual after placement is smallest (tightest fit) drives density and reduces leftover room.","measure":"r = (bins - item)/capacity; return -min(r[:,0], r[:,1]) (negative of the tighter post-placement residual). Empty bin: -1.0; a bin that becomes nearly full in its tight resource: near 0. Ranks tight bins highest.","target":"large: average room left CPU 15%->3%, mem 13%->0%, bins 436 -> 382; bimodal bins 297 -> 280.","builds_on":"","verdict":"refuted","delta":null,"base":"p0001"},{"id":"h0001","gen":1,"feature":"f0005","claim":"Champion in bimodal builds LL+LS (18) and LL+SL (15) pairs and strands 74 bins, while optimum builds 2LL (44) and 4SS+LS+SL. When a large job arrives it should go where a second large job could still follow (2LL) rather than where it blocks; conversely small jobs should fill gaps. Measure whether, after this placement, a typical next job still fits.","measure":"r = (bins - item)/capacity; return min(r[:,0], r[:,1]) * (r[:,0] > 0) * (r[:,1] > 0) but scaled: use np.clip(min(r0,r1),0,1) minus a penalty when the bin becomes too tight for a median job: return clip(min(r0,r1),0,1) - 0.5*(min(r0,r1) < 0.2). Empty bin: 1.0 - 0 = 1.0; a bin left with tight residual <0.2 loses 0.5, discouraging near-stranding while preferring bins with healthy slack.","target":"bimodal: stranded bins 74 -> toward 3, bins 297 -> 280; large stranded 55 -> /cap)/item * ... large -> ~1. Bin that fits exactly one more: ~0.3. Bin that would be full: ~0. Rewards bins that stay open for more of the same small class.","target":"small: jobs/bin 8.93 -> up, bins 112 -> down; correlated: 3-job bins 90 -> down, 4-5 job bins up","builds_on":"","verdict":"refuted","delta":null,"base":"p0001"},{"id":"h0005","gen":2,"feature":"f0013","claim":"In large and anticorr the champion makes 2-job bins of same-class pairs (LM+ML x49, LL+LM x44) and strands 55/104 bins, while optimum makes 3-job bins mixing a large job with two medium/small ones (LM+ML+MM, LM+ML+MS). The champion never checks whether the arriving job's class complements the bin's remaining *shape*: a large job dropped into a bin already holding a large job leaves a thin sliver in one resource that no future job can fill.","measure":"r = (bins - item)/capacity (post-placement residual). Define item class per resource: big = item/capacity > 0.4. For each bin, let m = min(r[:,0], r[:,1]) and M = max(r[:,0], r[:,1]). Return -( (M - m) ) * (m < 0.05) * (M > 0.25): negative penalty only for bins that would become stranded (one resource <5%, other >25%) after this job. Empty bin: m=M=1-item/cap, M-m small, condition false -> 0. Nearly-full balanced bin: 0. Stranding bin: strongly negative.","target":"large: stranded bins 55 -> down, jobs/bin 2.29 -> up; anticorr: stranded 104 -> down, 4-job bins 22 -> up","builds_on":"h0004","verdict":"supported","delta":1.513,"base":"p0001"},{"id":"h0008","gen":2,"feature":"f0016","claim":"In bimodal the champion makes LL+LS (18) and LL+SL (15) pairs and strands 74 bins; optimum makes 2LL (44) and 4SS+LS+SL. When a large job arrives, the champion puts it next to another large job in a bin whose *other* resource is nearly full, because it only sees total slack, not whether the arriving job's demand profile matches the bin's remaining profile. A better decision puts a CPU-heavy large job where memory is plentiful.","measure":"For each bin compute the normalised residual r = (bins - item)/capacity. Let need = item/capacity. Return sum over resources of need[d] * r[d] / (sum(need)+eps) minus max_d r[d]: i.e. the need-weighted average residual minus the larger residual. Rewards bins whose plentiful resource is the one this job does NOT consume, so a large job prefers a bin with slack on its light side. Empty bin: need-weighted avg = 1 - mean(need), max r = 1 - min(need) -> negative. Bin already tight on the job's heavy resource: large positive.","target":"bimodal: stranded 74 -> down, LL+LS/LL+SL 33 -> down, 2LL 0 -> up","builds_on":"h0001","verdict":"refuted","delta":null,"base":"p0001"},{"id":"h0012","gen":3,"feature":"f0024","claim":"In bimodal the champion makes 2LL x15 vs optimum 2LL x44 and strands nothing, leaving 8%/5% room. When a large job arrives and no open bin fits it, a new bin is forced — but when several open bins fit, the policy should strongly prefer the one that becomes tightest rather than opening. The signal is the post-placement min-residual compared directly against the empty bin's residual, as a ratio.","measure":"r = (bins - item)/capacity. tight = min(r[:,0], r[:,1]). Return tight / (tight + 0.05) for open bins, and 0 for the last (empty) row. Near-full bin (tight~0.02): 0.29; half-full (tight 0.5): 0.91; empty: 0. This rewards bins that become tight, penalises opening.","target":"bimodal: bins 290 -> toward 280, 2LL make-ups up from 15 toward 44, room left down","builds_on":"h0001","verdict":"refuted","delta":null,"base":"p0010"},{"id":"h0011","gen":3,"feature":"f0023","claim":"In large (432 vs 382) and anticorr (330 vs 299) the champion spreads jobs so that many bins sit at 2 jobs with 12-14% room left in both resources, while the optimum pushes 3-job bins to near-zero residual. The policy never compares 'how much this placement advances an already-open bin toward full' against 'start fresh'. A bin that would end up with a small but nonzero min-residual is the one to fill; the empty bin should only win when no open bin can be brought close to full.","measure":"r = (bins - item)/capacity. Return -(min(r[:,0], r[:,1])) for all rows, but subtract a fixed offset only for the last (empty) row: value = -min(r[:,0],r[:,1]) - 1.0*(row is last). This ranks near-full bins high and the empty bin low, so the optimiser can express 'prefer to top up an almost-full bin over opening'. Empty bin: -1 - 1 = -2; near-full bin: ~0.","target":"large: bins 432 -> toward 382, average room left CPU 14%->~4%; anticorr: 330 -> toward 299, 3-job bins replaced by 4-job bins","builds_on":"h0003","verdict":"refuted","delta":null,"base":"p0010"},{"id":"h0009","gen":3,"feature":"f0021","claim":"Champion large bins are LM+ML and LL+LM (two large jobs, one per resource) leaving 12-14% in both. Optimum makes 2LL (73) and LL+ML+MM: it stacks same-resource-heavy jobs because the other resource still has room. The policy can't tell 'this bin will end balanced-but-empty' from 'this bin will be tight in one resource and have room in the other' — the latter is fine because a complementary job fills it. Measure the post-placement gap between the two residuals, preferring bins where the larger residual is still usable.","measure":"r = (bins - item)/capacity. gap = r[:,0] - r[:,1]. Return -abs(gap) + max(r[:,0], r[:,1]) * (min(r[:,0],r[:,1]) > 0.05). I.e. reward imbalance only when the tight side still has >5% room (a complementary job can still fit). Empty bin: gap=0, max=1 -> ~1. A bin tight on CPU (r0=0.02,r1=0.4): -0.38 + 0 = -0.38.","target":"large: 2LL and LL+ML+MM make-ups should rise, bins 432->lower; anticorr 4-job bins up","builds_on":"h0005","verdict":"refuted","delta":null,"base":"p0010"},{"id":"h0010","gen":3,"feature":"f0022","claim":"In small the champion averages 9.01 jobs/bin same as optimum but uses 111 vs 111 bins with different make-ups: champion 9SS x12 vs optimum 8SS x13 and 13SS x5. The champion stops filling a bin once it looks 'full enough' in the min-resource; optimum keeps cramming tiny jobs into bins that still have any room. For small jobs the decision is purely 'which open bin has the most absolute remaining room in its tightest resource' — not a ratio.","measure":"Active only when max(item)/capacity < 0.2. Return min(bins[:,0]-item[0], bins[:,1]-item[1]) / capacity.min() for open bins (last row excluded -> set to -1). This is absolute tight-side slack; empty bin gets -1 so it's least preferred. A bin with 5% tight slack scores 0.05; empty scores -1.","target":"small: bins 111 -> toward 109, 8SS/13SS make-ups up, 9SS down","builds_on":"h0007","verdict":"refuted","delta":null,"base":"p0010"},{"id":"h0015","gen":4,"feature":"f0031","claim":"In large the champion uses 432 bins with 2.31 jobs/bin and 12-14% room left in BOTH resources, while optimum reaches 2.62 jobs/bin with only 3%/0% room. The champion never finishes a bin: it keeps placing into bins that still have room in both resources, so bins close half-empty. The decision it can't see is 'does this placement bring the bin close to closed?' — a bin that ends with both residuals small is a good bin; one that ends with both residuals moderate is wasted capacity. The current class_match_residual rewards matching item class to residual class but not the absolute tightness of the resulting bin.","measure":"r = (bins - item)/capacity. tight = min(r[:,0], r[:,1]); loose = max(r[:,0], r[:,1]). Return -(tight + loose)/2 for open bins (last row excluded), i.e. negative mean post-placement residual. Empty bin: -(1+1)/2 = -1. Nearly full bin (tight 0.02, loose 0.10): -0.06. Rewards the bin that ends up most filled overall, not just in its tight resource.","target":"large: bins used 432 -> toward 382, jobs/bin 2.31 -> up toward 2.62, average room left 14%/12% -> down toward 3%/0%.","builds_on":"h0011","verdict":"supported","delta":0.1827,"base":"p0010"},{"id":"h0016","gen":4,"feature":"f0032","claim":"In anticorr the champion makes LS+MS+SL x67 and LS+SL+SM x77 (3-job bins) but only 15 four-job bins, while optimum makes LS+MS+SL+SM x75. The champion's bins in anticorr stop at 3 jobs with 12%/12% room. The missing move is placing a small job into a bin that already holds a CPU-heavy and a memory-heavy job and still has room in the OTHER resource. The policy can't see whether the arriving job's resource is the one the bin has slack in.","measure":"r = (bins - item)/capacity. need = item/capacity. For each bin return (r[:,0] - r[:,1]) * (need[0] - need[1]) — product of post-placement residual skew and item skew. Rewards placing a CPU-heavy job into a bin with memory slack (and vice versa). Empty bin: 0. Bin with CPU slack 0.4, mem slack 0.05, item CPU-heavy (need skew +0.3): (0.4-0.05)*0.3 = +0.105. Bin with CPU slack 0.05, mem slack 0.4, same item: (0.05-0.4)*0.3 = -0.105.","target":"anticorr: 4-job bins 37 -> up toward 105, bins used 330 -> toward 299, room left 12%/12% -> down toward 3%/3%.","builds_on":"h0006","verdict":"refuted","delta":null,"base":"p0010"},{"id":"h0013","gen":4,"feature":"f0029","claim":"In bimodal the champion makes 2LL x15 vs optimum 2LL x44 and strands nothing while leaving 8%/5% room. When a large job arrives and no open bin has room for it, the champion opens a new bin (creating a fresh LL+LS pair later). The optimum puts two large jobs together. The decision the policy can't see: when the arriving job is large, prefer a bin whose remaining room in BOTH resources is large enough that a second large job could still fit — i.e. the bin is 'large-friendly'.","measure":"Active only when max(item)/capacity > 0.4. r = (bins - item)/capacity. Return min(r[:,0], r[:,1]) (post-placement tight residual) for open bins, and 0 for the last (empty) row. Empty bin: 0. Bin that after placing a large job still has tight residual 0.3: +0.3. Bin that becomes tight (0.05): +0.05. Rewards keeping bins open for a second large job rather than closing them.","target":"bimodal: 2LL x15 -> up toward 44, bins used 290 -> toward 280, room left 8 ct size the bin can still take in its tight resource. Empty bin: ~1.5 (room for one more). Bin that just fits: ~0 (closes). Ranks bins by room for a same-size repeat.","target":"uniform: 2LL+SS and 2ML+MS bin counts should rise (0/0 -> toward 12/8), LM+ML+MM should rise (0 -> toward 15), bins used 273 -> toward 267.","builds_on":"h0006","verdict":"flat","delta":-0.0049,"base":"p0027"},{"id":"h0019","gen":5,"feature":"f0039","claim":"In anticorr the champion makes 3-job bins (LS+MS+SL x68, LS+SL+SM x74) and only 37 four-job bins, while the optimum makes LS+MS+SL+SM x75 and 105 four-job bins. When a 3rd job lands, the policy does not check whether the bin would still admit a small opposite-class job; it just closes it. The decision: prefer the bin whose post-placement residual in BOTH resources stays above the small-job class (>=0.2 of capacity), so a 4th small job can still fit.","measure":"r = (bins - item)/capacity. Return min(r[:,0], r[:,1]) * (min(r[:,0], r[:,1]) > 0.2) - (1 - min(r[:,0], r[:,1])) * (min(r[:,0], r[:,1]) <= 0.2). I.e. +tight residual if the bin keeps >=20% in both resources (a 4th small job still fits), else -tight residual (closing). Empty bin: tight~0.6 -> +0.6. Nearly full bin: tight~0.02 -> -0.98. Ranks bins by whether they remain open to a 4th small job.","target":"anticorr: 4-job bin count should rise (37 -> toward 105), 3-job bins should fall, bins used 329 -> toward 299, room left 12%/12% -> toward 3%/3%.","builds_on":"h0016","verdict":"redundant","delta":0.0595,"base":"p0027"},{"id":"h0017","gen":5,"feature":"f0037","claim":"In bimodal the champion makes 2LL x13 vs optimum 2LL x44, and 3SS+LS+SL x10 vs optimum 4SS+LS+SL x13. When a large job arrives, the policy avoids bins that already hold a large job (2LL) and instead drops it into a bin with smalls, stranding the smalls' room. The decision: prefer a bin where the post-placement residual in the tight resource is either very small (bin closes cleanly, no smalls left behind) or very large with every default setting. It took about 4 minutes and 46 agent calls, and took the evaluator's score from −9.181 (Code Zero, first fit) to **−6.774**: 27.5% of the way to the optimal packing on train, 26.2% on the held-out test split. That's about where run 2 got after 30 generations of the program engine (27.4%), and above run 5 after 10 generations (25.1%).\n\nWhat the engine does each generation: the **Researcher** reads how the champion packs one instance per family next to a near-optimal packing, and proposes 4 *features* (a feature is a small function that scores every candidate bin). A **Coder** writes each one. At the same time the **Mutator**, which sees only the champion's code and its score, writes 4 more: variants of the champion's features, or fresh ones. **Fit** probes each feature alone on top of the champion at four weights, and if it survives, measures it with versus without (paired refits), on train and on separate validation instances. **Accept** combines the ones that helped on validation and refits the weights. The champion is the weighted sum of the features kept so far.\n\nWhat actually happened: 40 features were tried and 4 were kept, **all four from the deep loop**. The policy that came out is mostly two ideas: avoid stranding a bin (one resource nearly full while the other has room) and Best Fit (put the job where the bin ends up fullest). Two smaller features about where large jobs go were added in generation 5.","findings":[{"title":"The deep loop did all the work; the wide loop kept nothing","text":"All 4 kept features came from the Researcher. The Mutator wrote 20 features: 16 were rejected by the probe, 2 helped but were *redundant* (they repeated what the kept features already did), 1 was refuted and 1 was flat. In this run, the wide loop didn't find anything the deep loop then built on, which is the opposite of the \"get lucky, then cash in\" story."},{"title":"The wide loop isn't wide","text":"The Mutator's variant requests are aimed at the champion's own features, ordered by importance. With an empty library (generations 1 and 2) it can only write fresh features, and once one feature existed, 7 of its 9 variants over the next three generations were variants of that same feature (`class_match_residual`, f0013). It has no memory between generations (the air gap also keeps the research log away from it), so it re-proposed a cosine-alignment feature it had already tried: f0004 in generation 1 and f0009 in generation 2 are the same feature, with identical probe results (−14.257 and −26.292)."},{"title":"The same idea comes back under a new name, and nothing notices","text":"- Generation 1: f0001 (Mutator) and f0007 (Researcher) are the same measurement, the tighter resource's leftover after placing, and score identically (−0.350). f0005 ranks bins the same way with the sign flipped, and the probe tries both signs, so it scored −0.350 too. Three of eight slots went on one idea.\n- f0004 and f0009: the same cosine feature, a generation apart.\n- Generation 4's `anticorr_fourth_slot` (f0032) is generation 2's `pair_complementarity` (f0014) with the sign flipped.\n- Generation 3's `open_bin_fill_preference` (f0023) is generation 1's f0007 plus a fixed penalty on the new bin.\n\nThe research log shows verdicts, but nothing records that two features are the same approach. The probe results are a free fingerprint for this: two features with the same probe scores on the same champion rank bins the same way."},{"title":"The probe decides most features' fate, one feature at a time","text":"30 of the 40 features were rejected by the four-weight probe before any refitting. Each is judged alone on top of the champion, so a feature that only helps next to another one (a tie-breaker, say) can't survive. The mechanisms that would retry those, pair trials and the backlog revisit, are off by default (`--pairs 0`, `--revisit 0`). The search is greedy: one coordinate at a time, kept or dropped."},{"title":"What gets credited is the formula, not the idea","text":"- f0013 is named and argued as *class matching* (does the job's size class complement the bin's leftover shape?), but the measurement written for it is a pure stranding penalty: −(larger leftover − smaller leftover) when the smaller is under 5% and the larger over 25%. The stranding part is what was validated (+1.513), and the log records the class-matching claim as supported.\n- f0037's claim says to reward a large job's bin when it ends very tight *or* very roomy, and penalise the middle. Its formula rewards tight and penalises roomy, the Coder said so and implemented the formula literally, and the optimiser then fitted a *negative* weight. So the kept behaviour is the reverse of the formula: for large jobs, prefer bins that keep more than 20% room in both resources. Half of the claim, reached by accident.\n\nThe Researcher reads these verdicts next generation as evidence about its claims. Nothing checks that the claim, the measurement and the fitted sign agree."},{"title":"Textbook Best Fit only arrived in generation 4","text":"`closing_bin_penalty` (f0031), −(mean leftover after placing), is Best Fit. By the end it's the feature the policy relies on most (importance 5.72, against 1.63 for the stranding penalty). In generation 1 both loops proposed a different best fit, on the *tighter* resource only, which is worse than first fit here (−0.350) because it fills one resource and strands the other."},{"title":"\"Stuck\" is declared after one generation","text":"In generations 2 and 4 the Researcher was told \"the policy hasn't improved for 1 generations: the small refinements are used up\". In generation 2 the policy was still the empty Code Zero, so there were no refinements to use up. The message fires when `stuck >= 1`, while the extra ideas and the extra Mutator slot start at `stuck >= 2`."},{"title":"There is very little reasoning to see","text":"Hidden thinking is switched off (`reasoning_effort: none`), so what you read is all the reasoning there is. The Researcher writes its JSON first, then at most 100 words, in about 8 s. The Coder writes code and one sentence. The Mutator writes code and a name, with no explanation at all. The Researcher's claims are the only place the system says *why*. All thinking levels answer again on Luminal (checked today), so trying thinking for the Researcher alone is now possible and cheap."},{"title":"This isn't the \"exaggerate one aspect\" design","text":"The deep loop doesn't write exaggerated variants of the champion. It proposes a new *measurement* and Fit credits it with the difference it makes, with versus without. The exaggeration probes were the first design and were dropped after runs 1 and 2: the distorted copies always scored worse and crowded the pool (HANDOFF.md §9). If you want probes that exaggerate one aspect to learn about it, that's a change to build, not something the current code does."},{"title":"Fitting time grows when things go well","text":"Generations 1 to 4 took 13-32 s. Generation 5 took 152 s, 150 of them fitting: five features passed validation, so combining them, the joint refit and two second-chance retries all ran. The agents' time stayed at about 10 s per generation throughout."}],"generations":{"0":"Code Zero goes into the library. The library is empty, so every bin scores 0 and each job goes into the oldest bin it fits: first fit, −9.181.","1":"Nothing kept. The Researcher saw two failures in the packings (stranded bins in large, bimodal and anticorr; missing 4-job bins in anticorr) and proposed four features about leftovers after placing. The Mutator, with no features to vary, wrote four fresh ones. All eight were rejected by the probe. Three of them were the same idea (prefer the bin whose tighter resource ends fullest), which is worse than first fit here.","2":"The big jump: −9.181 to −7.356 (20.8%). The Researcher, reading that balance-only ideas had failed, proposed four features that condition on the arriving job. One of them, written as a stranding penalty, gained +1.83 on train and +1.51 on validation. The Mutator again wrote four fresh features (still nothing to vary), one of which repeated a generation-1 feature exactly.","3":"Nothing kept. The Mutator now had one feature to vary and spent four slots on it (three variants of the stranding penalty, one fresh); all rejected by the probe. The Researcher, through the lens of *open a new bin or use an open one*, proposed four features; one was a repeat of a generation-1 idea plus a penalty on the new bin. All eight rejected by the probe.","4":"−7.356 to −7.125 (23.5%). The Researcher noticed that the champion never finishes a bin (12-14% left in both resources in large) and proposed −(mean leftover after placing), which is Best Fit: kept, +0.38 train, +0.18 validation. Its other three ideas, including a sign-flipped repeat of generation 2's pair_complementarity, were rejected by the probe, as were all four Mutator features (three variants of the stranding penalty, one fresh).","5":"−7.125 to −6.774 (27.5%). Five features passed validation: three from the Researcher and two Mutator variants. Combined greedily, two Researcher features joined (both about where large jobs go); the rest were redundant with them. Second chances for two near-misses found nothing. Fitting took 150 s of the generation's 152."},"calls":{"c005":"Generation 1, Code Zero as the champion. It read the packings and named two failures: stranded bins (55 in large and 104 in anticorr, against 2 and 0 for the near-optimal packing) and anticorr stopping at 3-job bins where the optimum builds 4-job ones. It proposed four features, all measured on the leftover after placing: balance between the two leftovers, the tighter leftover (tightest fit), slack on the job's light resource minus its heavy one, and \"room for another job\". It said plainly that the champion never compares bins at all, so every idea is about comparing them.","c014":"Generation 2. It read the log (generation 1's balance-only features all failed) and concluded they failed because they ignored the arriving job. All four new ideas condition on the job: penalise bins this job would strand (class_match_residual, the one that worked), match the job's demand profile to the bin's leftover profile (bimodal), count how many more copies of a small job still fit, and pair CPU-heavy jobs with bins that have memory slack (uniform). It was also told the small refinements were used up, which wasn't true yet.","c023":"Generation 3, through the lens of opening a new bin or using an open one. It saw large and anticorr bins closing at 2 jobs with 12-14% left in both resources, and proposed: prefer topping up a nearly full bin over opening (a repeat of generation 1's tightest-fit idea, plus a penalty on the new bin), reward imbalance only while it's still usable, absolute slack for tiny jobs, and a ratio form of tightness. All four were rejected by the probe.","c033":"Generation 4. Its key observation: the champion *never finishes a bin*; in large it closes bins with 12-14% left in both resources, where the optimum leaves 3% and 0%. That gave closing_bin_penalty, −(mean leftover after placing), which is Best Fit, and it was kept. The other three: a skew-matching feature for anticorr (generation 2's pair_complementarity with the sign flipped), keeping room for a second large job in bimodal, and piling small jobs into the fullest bin.","c042":"Generation 5, through the lens of job size classes sharing a bin. A single theme across four families: the policy treats each job as a one-off fit and never asks whether the bin can still take another job of the same class. Four features: room for a second large job (big_with_big_room_penalty, kept), room for a fourth small job in anticorr (redundant), a large job closing a bin cleanly or leaving room for another large one (bimodal_small_slot_for_large, kept, though its formula contradicts that sentence), and room for a same-size repeat in uniform (flat)."},"features":{"f0001":"Mutator, fresh: prefer the bin whose tighter resource ends up fullest after placing (−min of the two leftovers). The same measurement as the Researcher's f0007 in the same generation. Worse than first fit by 0.350 at every weight, so rejected by the probe.","f0002":"Mutator, fresh: signed imbalance of the leftovers, scaled by how full the bin would be. Catastrophic at both signs (about −42); rejected by the probe.","f0003":"Mutator, fresh: an estimate of the thin, unusable strip a job leaves in a bin. Rejected by the probe (−1.533 at best).","f0004":"Mutator, fresh: cosine between the bin's remaining room and the job's demand (a Tetris-style alignment). Rejected by the probe (−14.257). Re-proposed a generation later as f0009, with identical results.","f0005":"Researcher's \"room for another job\": the tighter leftover after placing, minus 0.5 if that falls under 20%. With the sign the optimiser prefers, it ranks bins exactly like f0001 and f0007 (−0.350 at the good sign), so it was the third copy of one idea in this generation.","f0006":"Researcher's complementarity idea for anticorr: slack on the job's light resource minus slack on its heavy one. Rejected by the probe (−10.607 at best): it sends jobs to bins that suit their shape regardless of how full they are.","f0007":"Researcher's \"tightest fit\": −(the tighter leftover after placing). It expected denser bins in large and bimodal; it scored −0.350, because filling one resource strands the other. The same measurement as f0001.","f0008":"Researcher's balance idea: −|CPU leftover − memory leftover| after placing, to stop stranding. Alone it's much worse than first fit (−3.433); it never got to be tried next to a fullness feature.","f0009":"Mutator, fresh: cosine alignment again, the same feature as f0004 from generation 1 (identical probe scores). The Mutator has no record of what it tried before.","f0010":"Mutator, fresh: the geometric mean of the two leftovers, divided by the job's own size. The only Mutator feature in generations 1-2 to pass the probe (−0.061 at the good sign), but it lost 0.522 on validation: refuted.","f0011":"Mutator, fresh: smaller leftover minus the gap between the two (a balance score). Rejected by the probe (−4.326).","f0012":"Mutator, fresh: how much the bin's scarcer resource gets used, plus half the imbalance. Rejected by the probe (−1.876).","f0013":"**Kept, generation 2: the run's biggest gain** (+1.828 train, +1.513 validation). Named and argued as class matching, but the code is a stranding penalty: score −(larger leftover − smaller leftover) for a bin this job would leave with under 5% in one resource and over 25% in the other, 0 otherwise. Fitted weight +0.38. It's still the second most important feature at the end.","f0014":"Researcher's complementary pairing for uniform: −(bin leftover skew × job skew), to put CPU-heavy jobs where memory is plentiful and vice versa. Rejected by the probe (−11.459). It came back with the sign flipped in generation 4 (f0032).","f0015":"Researcher's small-job density: for small jobs only, how many more copies of this job the bin could still take. Rejected by the probe (−0.292 at best).","f0016":"Researcher's demand-profile match for bimodal: need-weighted average leftover minus the larger leftover. Rejected by the probe (−4.795).","f0017":"Mutator, fresh: signed, normalised leftover imbalance scaled by fullness. Catastrophic at both signs (about −36).","f0018":"Mutator, variant of the stranding penalty: a softer, graded version (soft thresholds instead of 5%/25% cut-offs). Worse than the champion at every weight (−1.748 at best).","f0019":"Mutator, variant of the stranding penalty: how much the placement worsens the imbalance, relative to the job's size. Its first version returned the wrong shape and was repaired (call c028); the repaired version lost 0.101 at best, so rejected by the probe.","f0020":"Mutator, variant of the stranding penalty with soft ramps and extra weight for jobs that are big in one resource only. Rejected by the probe (−0.552).","f0021":"Researcher's \"imbalance is fine while still usable\": −|gap| + larger leftover when the smaller is over 5%. Rejected by the probe (−1.743).","f0022":"Researcher's absolute tight-side slack for tiny jobs, with the new bin always last. Rejected by the probe (−3.425).","f0023":"Researcher's \"top up a nearly full bin rather than open one\": −(tighter leftover), minus 1 for the new bin. Generation 1's tightest-fit idea (f0007) with a penalty on opening. The closest miss of the generation (−0.081), but still rejected by the probe.","f0024":"Researcher's ratio form of tightness, tight/(tight + 0.05), with the new bin set to 0. Rejected by the probe (−7.923).","f0025":"Mutator, fresh: tighter leftover divided by looser leftover. Rejected by the probe (−1.367).","f0026":"Mutator, variant of the stranding penalty, scaled by how full the bin already is. Rejected by the probe (−0.552).","f0027":"Mutator, variant of the stranding penalty, weighted by how much the leftover's skew differs from the job's own skew. Rejected by the probe (−2.270).","f0028":"Mutator, variant of the stranding penalty, signed by which resource is left tight. Rejected by the probe (−0.686).","f0029":"Researcher's \"keep bins open for a second large job\": for large jobs only, the tighter leftover after placing, 0 for the new bin. Rejected by the probe (−0.554).","f0030":"Researcher's \"pile small jobs into the fullest bin\": for small jobs, −(sum of leftovers), new bin last. Rejected by the probe (−15.554). The new bin was set to −1, but a nearly empty open bin scores close to −2, so small jobs preferred opening a new bin over any open bin less than half full.","f0031":"**Kept, generation 4** (+0.379 train, +0.183 validation): −(mean of the two leftovers after placing), which is Best Fit. It came from the Researcher noticing that the champion never finishes a bin. Fitted weight +0.87, and by the end it's the most important feature (importance 5.72).","f0032":"Researcher's skew-matching for anticorr: leftover skew × job skew. Exactly generation 2's pair_complementarity (f0014) with the sign flipped, and the probe tries both signs, so this was the same test again. Rejected (−13.633).","f0033":"Mutator, variant of Best Fit: fill the binding resource, minus half the imbalance. Exactly no effect at small weights and lost a little on validation: flat.","f0034":"Mutator, variant of the stranding penalty with soft thresholds, weighted by how lopsided the job is. Helped alone (+0.084 validation) but added nothing once the generation's two kept features were in: redundant.","f0035":"Mutator, fresh: which resource is the bottleneck after placing, signed, scaled by tightness. Rejected by the probe (−0.231).","f0036":"Mutator, variant of Best Fit that weights nearly sealed bins more (1/(tight + 0.1)). The best Mutator feature of the run (+0.116 train, +0.126 validation), but redundant next to the kept features.","f0037":"**Kept, generation 5** (+0.203 train, +0.070 validation). For large jobs only. The claim was: reward bins that close cleanly or keep room for another large job, penalise the middle. The formula instead rewards tight and penalises roomy (the Coder flagged this and followed the formula), and the optimiser fitted a weight of −0.45, reversing it. What the policy uses: for large jobs, prefer bins that keep more than 20% room in both resources.","f0038":"Researcher's \"room for a same-size repeat\" for uniform: how many more jobs of this exact size fit in the tight resource. Flat on validation (−0.005); its second chance next to the kept features lost badly (−1.593).","f0039":"Researcher's \"room for a fourth small job\" in anticorr: +tighter leftover if both resources keep 20%, else −tighter leftover (the Coder read one term differently from the text and said so). Helped alone (+0.060) but redundant next to the kept features.","f0040":"**Kept, generation   ["accept_log", 190, 486, "verdicts"],
];
const TRAY = { x: 458, y: 702, step: 22, max: 11 };        // cards waiting in Fit
const HEAD = { x: 742, y: 686 };                            // the card under test
const QUEUE = { x: 536, y: 486, step: 22 };                 // winners waiting at Accept

/* ============================================================ state */
let T = null;            // the trace
let IX = null;           // indexes into it
let S = null;            // the schedule
let now = 0, playing = false, speed = 1, lastFrame = null;
let selected = null;     // {type, id, ...}

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============================================================ loading */
function load(trace) {
  if (!trace || !String(trace.format || "").startsWith("helix-trace/")) {
    alert("That file isn't a Helix trace (it has no helix-trace format tag).");
    return;
  }
  T = trace;
  IX = buildIndex(T);
  S = buildSchedule();
  $("#dropzone").hidden = true;

  buildTrack();
  buildGenButtons();

  renderChampions();
  renderNotes();
  const c = T.run.config || {};
  $("#runline").textContent = `Run ${T.run.id}: ${T.generations.length - 1} generations of the ${c.engine || "feature"} engine, ${c.flash_model || "model unknown"}`;
  document.title = `Helix run ${T.run.id}`;
  now = 0; selected = null;
  seek(S.gens[1] ? S.gens[1].t0 - 0.01 : 0);
  showInspector();
  if (!reduceMotion) { setTimeout(() => setPlaying(true), 600); }
}

function buildIndex(t) {
  const calls = new Map(t.calls.map(c => [c.id, c]));
  const feats = new Map(t.features.map(f => [f.id, f]));
  const ideas = new Map(t.ideas.filter(i => i.feature).map(i => [i.feature, i]));
  const gens = new Map(t.generations.map(g => [g.gen, g]));
  const callsOf = new Map();
  for (const c of t.calls) { if (c.feature) { if (!callsOf.has(c.feature)) callsOf.set(c.feature, []); callsOf.get(c.feature).push(c); } }
  return { calls, feats, ideas, gens, callsOf };
}
const noteFor = (kind, id) => (T.notes && T.notes[kind] && T.notes[kind][id]) || null;
const isAuto = id => (T.notes && T.notes.auto || []).includes(id);

/* ============================================================ SCHEDULE */
// The animation runs on its own clock. Real durations still set the order and the relative lengths:
// a call that took 7 s works visibly longer than one that took 2 s, but nobody waits 7 s.
const D = { travel: 1.05, inspect: 0.9, refit: 0.8, accept: 1.3, start: 0.8, gap: 0.7, out: 0.75 };
const workTime = real => clamp(0.55 + 0.3 * (real || 1), 0.7, 4.2);
const realFit = f => f && f.timing ? (f.timing.total ?? f.timing.probe ?? null) : null;
const testTime = f => clamp(0.45 + 0.2 * (realFit(f) || (f.verdict === "probe-rejected" ? 1.2 : 8)), 0.55, 3.2);

function buildSchedule() {
  const sch = { envs: [], cards: new Map(), works: [], gens: [], scores: [], beats: new Set(), end: 0 };
  const env = (id, path, t0, label, tone, ref, dur = D.travel) => {
    sch.envs.push({ id, path, t0, t1: t0 + dur, label, tone, ref });
    sch.beats.add(+t0.toFixed(3));
    return t0 + dur;
  };
  const work = (node, t0, t1, label, ref, bay = null) => { sch.works.push({ node, t0, t1, label, ref, bay }); sch.beats.add(+t0.toFixed(3)); };
  const card = f => {
    if (!sch.cards.has(f.id)) sch.cards.set(f.id, { f, tone: f.branch === "deep" ? "deep" : "wide", segs: [], stamps: [] });
    return sch.cards.get(f.id);
  };
  const seg = (f, type, t0, t1, path = null) => card(f).segs.push({ type, t0, t1, path });

  let t = 0;
  const g0 = IX.gens.get(0);
  sch.gens.push({ gen: 0, t0: 0, t1: 2.2 });
  if (g0) {
    env("cz", "cz_lib", 0.2, "Code Zero", "seed", { type: "champion", id: g0.champion });
    sch.scores.push({ t: 1.25, gen: 0, champion: g0.champion });
  }
  t = 2.2;
  const docked = new Map();                       // fid -> dock segment (to close it on retirement)

  for (const g of T.generations.filter(g => g.gen > 0)) {
    const t0 = t;
    sch.beats.add(+t0.toFixed(3));
    const gc = T.calls.filter(c => c.gen === g.gen);
    const feats = T.features.filter(f => f.gen === g.gen);
    const arrive = new Map();                      // fid -> time its card reaches Fit
    let latest = t0 + D.start;

    // ---- deep loop: Inspect, then the Researcher's prompt arrives from three places at once
    const tIns = env(`ins${g.gen}`, "lib_inspect", t0 + 0.15, "champion", "lib", { type: "library", gen: g.gen });
    work("inspect", tIns, tIns + D.inspect, "Inspect is packing the diagnostic instances", { type: "inspect", gen: g.gen });
    const res = gc.filter(c => c.role === "researcher").sort((a, b) => (a.start || 0) - (b.start || 0));
    let tR = tIns + D.inspect;
    if (res.length) {
      const first = res[0];
      env(`rp${g.gen}a`, "inspect_res", tR, "packings", "deep", { type: "call", id: first.id, section: "What the packings look like" });
      env(`rp${g.gen}b`, "lib_res", tR, "policy", "lib", { type: "call", id: first.id, section: "The policy" });
      const arr = env(`rp${g.gen}c`, "log_res", tR, "log", "deep", { type: "call", id: first.id, section: "Research log" });
      let tc = arr;
      for (const c of res) {
        const d = workTime(c.seconds);
        work("researcher", tc, tc + d, c.kind === "retry" ? "Researcher, asked again for JSON only" : "Researcher is reading and proposing", { type: "call", id: c.id });
        tc += d;
      }
      tR = tc;
    }
    // ideas -> Coder -> Fit
    const deepFeats = feats.filter(f => f.branch === "deep");
    deepFeats.forEach((f, i) => {
      const idea = IX.ideas.get(f.id);
      const arr = env(`idea${f.id}`, "res_coder", tR + i * 0.09, short(f.name, 22), "deep", { type: "idea", id: f.id });
      let tc = arr;
      const writes = (IX.callsOf.get(f.id) || []).filter(c => c.kind !== "repair");
      for (const c of writes) {
        const d = workTime(c.seconds);
        work("coder", tc, tc + d, `Coder is writing ${f.name}`, { type: "call", id: c.id }, f.id);
        tc += d;
      }
      seg(f, "travel", tc, tc + D.travel, "coder_fit");
      arrive.set(f.id, tc + D.travel);
      void idea;
    });

    // ---- wide loop, at the same time: one prompt per Mutator call, through the air gap
    const wideFeats = feats.filter(f => f.branch === "wide");
    wideFeats.forEach((f, i) => {
      const writes = (IX.callsOf.get(f.id) || []).filter(c => c.kind !== "repair");
      const first = writes[0];
      const arr = env(`mp${f.id}`, "lib_mut", t0 + 0.25 + i * 0.16, i === 0 ? "code + score" : "", "wide",
        first ? { type: "call", id: first.id } : { type: "feature", id: f.id }, D.travel * 1.25);
      let tc = arr;
      for (const c of writes) {
        const d = workTime(c.seconds);
        work("mutator", tc, tc + d, `Mutator is writing ${f.note && f.note.startsWith("variant") ? "a variant" : "a fresh feature"}`, { type: "call", id: c.id }, f.id);
        tc += d;
      }
      seg(f, "travel", tc, tc + D.travel * 1.2, "mut_fit");
      arrive.set(f.id, tc + D.travel * 1.2);
    });

    // ---- Fit: refit the champion first, then try each card, one at a time, in the order the run did
    let fitFree = t0 + D.start + 0.4;
    if ((g.before && IX.gens.get(g.gen - 1) && (IX.gens.get(g.gen - 1).library || []).length)) {
      work("fit", fitFree, fitFree + D.refit, "Fit is refitting the champion's own weights", { type: "refit", gen: g.gen });
      fitFree += D.refit;
    }
    const order = fitOrder(g, feats, arrive);
    for (const f of order) {
      const a = arrive.get(f.id) ?? fitFree;
      seg(f, "tray", a, Math.max(a, fitFree));
      let t1 = Math.max(a, fitFree);
      const repairs = (IX.callsOf.get(f.id) || []).filter(c => c.kind === "repair");
      for (const c of repairs) {                  // the error goes back to the author, a fixed version comes back
        const back = f.branch === "deep" ? ["fit_coder", "coder_fit", "coder"] : ["fit_mut", "mut_fit", "mutator"];
        const tb = env(`rep${c.id}`, back[0], t1, "error", "bad", { type: "call", id: c.id });
        seg(f, "away", t1, tb + workTime(c.seconds) + D.travel);
        work(back[2], tb, tb + workTime(c.seconds), `repairing ${f.name}`, { type: "call", id: c.id }, f.id);
        t1 = tb + workTime(c.seconds) + D.travel;
      }
      const d = testTime(f);
      seg(f, "test", t1, t1 + d);
      work("fit", t1, t1 + d, `Fit is trying ${f.name}`, { type: "feature", id: f.id });
      const c = card(f);
      const winner = f.delta_valid != null && f.delta_valid > (T.run.config.accept_margin ?? 0.03) && f.verdict !== "invalid";
      c.stamps.push({ t: t1 + d * 0.7, kind: fitBadge(f) });
      if (winner) seg(f, "travel", t1 + d, t1 + d + D.out, "fit_accept"), seg(f, "queue", t1 + d + D.out, Infinity);
      else seg(f, "travel", t1 + d, t1 + d + D.out, "fit_scrap"), seg(f, "scrap", t1 + d + D.out, Infinity);
      fitFree = t1 + d;
    }
    for (const f of feats) if (!arrive.has(f.id) && !order.includes(f)) {     // never reached Fit (rare)
      seg(f, "scrap", fitFree, Infinity);
    }
    latest = Math.max(latest, fitFree, ...[...arrive.values()]);

    // ---- Accept: winners join the library (or are found redundant), losers already went to scrap
    const tA = latest + 0.2;
    work("accept", tA, tA + D.accept, "Accept is combining the winners and refitting", { type: "accept", gen: g.gen });
    const tA1 = tA + D.accept;
    for (const f of feats) {
      const c = sch.cards.get(f.id);
      if (!c) continue;
      const q = c.segs.find(s => s.type === "queue");
      if (!q) continue;
      q.t1 = tA1;
      if (f.verdict === "kept") {
        c.stamps.push({ t: tA1 - 0.25, kind: "kept" });
        seg(f, "travel", tA1, tA1 + D.travel, "accept_lib");
        const dock = { type: "dock", t0: tA1 + D.travel, t1: Infinity, path: null };
        c.segs.push(dock); docked.set(f.id, dock);
      } else {
        c.stamps.push({ t: tA1 - 0.25, kind: f.verdict === "redundant" ? "redundant" : "flat" });
        seg(f, "travel", tA1, tA1 + D.out, "accept_scrap");
        seg(f, "scrap", tA1 + D.out, Infinity);
      }
    }
    for (const fid of g.retired || []) {           // retired from the library
      const dock = docked.get(fid);
      const f = IX.feats.get(fid);
      if (dock && f) {
        dock.t1 = tA1;
        const c = sch.cards.get(fid);
        c.stamps.push({ t: tA1 - 0.2, kind: "retired" });
        seg(f, "travel", tA1, tA1 + D.out * 1.4, "lib_scrap");
        seg(f, "scrap", tA1 + D.out * 1.4, Infinity);
      }
    }
    if (deepFeats.length) env(`log${g.gen}`, "accept_log", tA1, "verdicts", "deep", { type: "log", gen: g.gen + 1 });
    sch.scores.push({ t: tA1 + D.travel, gen: g.gen, champion: g.champion });
    const tEnd = tA1 + D.travel + 0.15;
    sch.gens.push({ gen: g.gen, t0, t1: tEnd });
    t = tEnd + D.gap;
  }
  sch.end = t;
  sch.envs.forEach(e => { e.len = null; });
  sch.beats = [...sch.beats].sort((a, b) => a - b);
  return sch;
}

function fitOrder(g, feats, arrive) {
  // The run's own order, from its console lines ("   f0013 deep class_match_residual ..."); else by arrival.
  const seen = [];
  for (const line of g.console || []) {
    const m = line.match(/^\s*(f\d+)\s+(deep|wide)\s/);
    if (m && !seen.includes(m[1])) seen.push(m[1]);
  }
  const byId = new Map(feats.map(f => [f.id, f]));
  const ordered = seen.map(id => byId.get(id)).filter(Boolean);
  const rest = feats.filter(f => !seen.includes(f.id)).sort((a, b) => (arrive.get(a.id) ?? 0) - (arrive.get(b.id) ?? 0));
  return ordered.concat(rest);
}
function fitBadge(f) {
  if (f.verdict === "invalid") return "invalid";
  if (f.verdict === "probe-rejected") return "probe";
  const m = T.run.config.accept_margin ?? 0.03;
  if (f.delta_valid != null && f.delta_valid > m) return "good";
  if (f.delta_valid != null && f.delta_valid < -m) return "refuted";
  return "flat";
}
const BADGE = {
  kept: ["b-kept", "✓", "kept"], good: ["b-good", "+", "passed on validation"], probe: ["b-bad", "✕", "rejected by the probe"],
  refuted: ["b-bad", "−", "refuted"], invalid: ["b-bad", "!", "invalid"], flat: ["b-flat", "~", "no clear gain"],
  redundant: ["b-flat", "=", "redundant"], retired: ["b-red", "↓", "retired"],
};

function concurrent(node, t) {
  return S.works.filter(w => w.node === node && w.bay && w.t0 < t && w.t1 > t).length;
}

function drawNode(key, n, bays) {

  g.append(sv("title", {}, n.title));

  g.append(sv("rect", { class: "cap", x: n.x + 0.7, y: n.y + 0.7, width: n.w - 1.4, height: capH - 0.7, rx: 5.3 }));
  if (capH < n.h) g.append(sv("rect", { class: "cap", x: n.x + 0.7, y: n.y + capH - 6, width: n.w - 1.4, height: 6 }));

  const stat = sv("text", { class: "stat", x: n.x + n.w - 26, y: n.y + 17, "text-anchor": "end", fill: "#fff", style: "fill:#fff" }, "");

  g.append(sub);
  const bar = sv("rect", { class: "bar", x: n.x + 1, y: n.y + n.h - 5, width: 0, height: 4 });
  g.append(bar);
  els.nodes[key] = { g, stat, sub, bar, n };
  if (n.bays && bays) {
    els.bays[key] = [];
    const bw = (n.w - 20 - (bays - 1) * 5) / bays;
    for (let i = 0; i < bays; i++) {
      const x = n.x + 10 + i * (bw + 5), y = n.y + 52;
      const b = sv("g", { class: "bay" },
