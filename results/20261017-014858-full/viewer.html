        sv("text", { x: x + 4, y: y + 22 }, ""));
      g.append(b);
      els.bays[key].push({ g: b, fill: b.children[1], text: b.children[2], x, w: bw });
    }
  }
  return g;
}

function pointOn(key, p) {
  const path = pathEls[key];
  if (!path) return { x: 0, y: 0 };
  const L = path.__len ?? (path.__len = path.getTotalLength());
  const pt = path.getPointAtLength(clamp(p, 0, 1) * L);
  return { x: pt.x, y: pt.y };
}

function cardState(c, t) {
  for (const s of c.segs) if (t >= s.t0 && t < s.t1) return s;
  return null;
}

function render(t) {
  if (!S) return;
  // generation stencil and scoreboard
  const gNow = S.gens.filter(g => g.t0 <= t + 1e-6).pop() || S.gens[0];
  $("#stencil").textContent = gNow ? gNow.gen : "";
  $("#stencil-sub").textContent = gNow ? (gNow.gen === 0 ? "generation 0, Code Zero" : "generation") : "";
  updateBoard(t, gNow);
  // parcels
  for (const e of S.envs) {
    const g = els.envs.get(e.id);
    if (t >= e.t0 && t < e.t1) {
      const pt = pointOn(e.path, ease((t - e.t0) / (e.t1 - e.t0)));
      g.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
      g.setAttribute("visibility", "visible");
    } else g.setAttribute("visibility", "hidden");
    g.classList.toggle("sel", isSel(e.ref));
  }
  // cards: where each one is at this moment
  const tray = [], queue = [], dock = [], pile = [];
  const states = new Map();
  for (const [fid, c] of S.cards) {
    const s = cardState(c, t);
    states.set(fid, s);
    if (!s) continue;
    if (s.type === "tray") tray.push([s.t0, fid]);
    if (s.type === "queue") queue.push([s.t0, fid]);
    if (s.type === "dock") dock.push([s.t0, fid]);
    if (s.type === "scrap") pile.push([s.t0, fid]);
  }
  const slot = arr => new Map(arr.sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : 1)).map(([, fid], i) => [fid, i]));
  const trayI = slot(tray), queueI = slot(queue), dockI = slot(dock), pileI = slot(pile);
  for (const [fid, c] of S.cards) {
    const g = els.cards.get(fid);
    const s = states.get(fid);
    if (!s || s.type === "away") { g.setAttribute("visibility", "hidden"); continue; }
    let x = 0, y = 0, chip = false, label = false, show = true;
    if (s.type === "travel") { const pt = pointOn(s.path, ease((t - s.t0) / (s.t1 - s.t0))); x = pt.x; y = pt.y; label = !/scrap/.test(s.path); }
    else if (s.type === "tray") { const i = Math.min(trayI.get(fid), TRAY.max - 1); x = TRAY.x + 8 + i * TRAY.step; y = TRAY.y + 4; }
    else if (s.type === "test") { x = HEAD.x; y = HEAD.y; label = true; }
    else if (s.type === "queue") { const i = queueI.get(fid); x = QUEUE.x + i * QUEUE.step; y = QUEUE.y + 6; }
    else if (s.type === "dock") {
      const i = dockI.get(fid);
      if (i >= DOCK.cols * 3) show = false;          // the library shows 12 chips; the panel lists them all
      x = DOCK.x + (i % DOCK.cols) * (DOCK.w + DOCK.gx); y = DOCK.y + Math.floor(i / DOCK.cols) * (DOCK.h + DOCK.gy); chip = true;
    } else if (s.type === "scrap") {
      const i = pileI.get(fid), n = pile.length;
      if (i < n - 4) show = false;
      const k = i - Math.max(0, n - 4);
      x = PILE.x + k * 9; y = PILE.y - k * 2;
    }
    if (!show) { g.setAttribute("visibility", "hidden"); continue; }
    g.setAttribute("visibility", "visible");
    g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    g.querySelector(".glyphg").setAttribute("visibility", chip ? "hidden" : "visible");
    g.querySelector(".chip").setAttribute("visibility", chip ? "visible" : "hidden");
    g.querySelector(".clabel").setAttribute("visibility", label && !chip ? "visible" : "hidden");
    const st = c.stamps.filter(s2 => s2.t <= t).pop();
    const badge = g.querySelector(".badge");
    if (st && !chip) {
      const [cls, sym, word] = BADGE[st.kind] || BADGE.flat;
      badge.setAttribute("class", "badge " + cls);
      badge.querySelector("text").textContent = sym;
      badge.setAttribute("visibility", "visible");
      if (s.type === "test" || (s.type === "travel")) g.querySelector(".clabel").textContent = `${short(c.f.name, 22)}: ${word}`;
    } else {
      badge.setAttribute("visibility", "hidden");
      g.querySelector(".clabel").textContent = short(c.f.name, 26);
    }
    g.classList.toggle("sel", isSel({ type: "feature", id: fid }));
  }
  // machines: busy lamps, progress, bays
  const active = S.works.filter(w => t >= w.t0 && t < w.t1);
  for (const [key, ne] of Object.entries(els.nodes)) {
    const mine = active.filter(w => w.node === key);
    ne.g.classList.toggle("busy", mine.length > 0);
    ne.g.classList.toggle("sel", selected && selected.type === "node" && selected.node === key);
    if (mine.length && !NODES[key].bays) {
      const w = mine[0];
      ne.bar.setAttribute("width", ((ne.n.w - 2) * clamp((t - w.t0) / (w.t1 - w.t0), 0, 1)).toFixed(1));
    } else ne.bar.setAttribute("width", 0);
  }
  for (const key of ["coder", "mutator"]) {
    const bays = els.bays[key] || [];
    const mine = active.filter(w => w.node === key).sort((a, b) => a.t0 - b.t0 || (a.bay < b.bay ? -1 : 1));
    bays.forEach((b, i) => {
      const w = mine[i];
      b.g.classList.toggle("busy", !!w);
      b.fill.setAttribute("fill", w ? "currentColor" : "none");
      b.fill.setAttribute("width", w ? (b.w * clamp((t - w.t0) / (w.t1 - w.t0), 0, 1)).toFixed(1) : 0);
      const f = w && IX.feats.get(w.bay);
      b.text.textContent = f ? short(f.name || f.id, Math.max(6, Math.floor(b.w / 5.6))) : "";
    });
  }
  nodeStats(t, gNow, pile.length, dock.length);
  $("#caption").textContent = caption(t, active, gNow);
  updateTrack(t);
}

function nodeStats(t, gNow, nScrap, nDock) {
  const sc = currentScore(t);
  const ch = sc && T.champions[sc.champion];
  els.nodes.library.stat.textContent = ch ? `${ch.id}  ${num(ch.score)}` : "";
  els.nodes.library.sub.textContent = nDock ? "" : "empty: every bin scores 0, so this is Code Zero (first fit)";
  els.nodes.scrap.stat.textContent = nScrap ? String(nScrap) : "";
  const g = gNow && IX.gens.get(gNow.gen);
  const cz = T.run.code_zero;
  els.nodes.codezero.sub.textContent = "";
  const per = node => S.works.filter(w => w.node === node && w.t0 <= t && gNow && w.t0 >= gNow.t0);
  const total = node => S.works.filter(w => w.node === node && gNow && w.t0 >= gNow.t0 && w.t0 < gNow.t1);
  for (const k of ["coder", "mutator"]) {
    const a = per(k).length, b = total(k).length;
    els.nodes[k].stat.textContent = b ? `${a}/${b}` : "";
  }
  const fitN = per("fit").filter(w => w.ref.type === "feature").length, fitT = total("fit").filter(w => w.ref.type === "feature").length;
  els.nodes.fit.stat.textContent = fitT ? `${fitN}/${fitT}` : "";
  els.nodes.accept.stat.textContent = g && g.gen > 0 && t >= (S.gens.find(x => x.gen === g.gen) || {}).t1 - 1.3 ? (g.accepted.length ? `kept ${g.accepted.length}` : "kept 0") : "";
  void cz;
}

function caption(t, active, gNow) {
  if (!gNow) return "";
  if (gNow.gen === 0) return "Generation 0: Code Zero goes into the library. Nothing is added; every bin scores 0, so jobs go into the oldest bin that fits.";
  const order = ["researcher", "inspect", "coder", "mutator", "fit", "accept"];
  const parts = [];
  for (const node of order) {
    const ws = active.filter(w => w.node === node);
    if (!ws.length) continue;
    if (ws.length > 1) parts.push(`${NODES[node].title} is writing ${ws.length} features`);
    else {
      const w = ws[0];
      const c = w.ref.type === "call" ? IX.calls.get(w.ref.id) : null;
      parts.push(w.label + (c ? ` (real ${c.seconds.toFixed(1)} s)` : w.ref.type === "feature" && realFit(IX.feats.get(w.ref.id)) ? ` (real ${realFit(IX.feats.get(w.ref.id)).toFixed(1)} s)` : ""));
    }
  }
  if (!parts.length) {
    const g = IX.gens.get(gNow.gen);
    if (t >= gNow.t1 - 1.2 && g) return g.accepted.length ? `Generation ${g.gen}: kept ${g.accepted.map(id => IX.feats.get(id)?.name || id).join(", ")}; champion now ${num(g.official)}` : `Generation ${g.gen}: nothing kept; the champion stays at ${num(g.official)}`;
    const moving = S.envs.filter(e => t >= e.t0 && t < e.t1);
    const belts = [...S.cards.values()].map(c => cardState(c, t)).filter(s2 => s2 && s2.type === "travel").map(s2 => s2.path);
    const say = { coder_fit: "features on their way to Fit", mut_fit: "features on their way to Fit", fit_accept: "winners going to Accept",
      accept_lib: "kept features going into the library", fit_scrap: "rejected features going to the scrap pile",
      accept_scrap: "features that added nothing going to the scrap pile", lib_scrap: "a retired feature leaving the library" };
    const bits = [...new Set(belts.map(b => say[b]).filter(Boolean))];
    if (bits.length) return `Generation ${gNow.gen}: ` + bits.join("; ");
    if (moving.length) return `Generation ${gNow.gen}: messages on their way`;
    return `Generation ${gNow.gen}`;
  }
  return `Generation ${gNow.gen}: ` + parts.join("; ");
}

function currentScore(t) { return S.scores.filter(s => s.t <= t).pop() || null; }

function updateBoard(t, gNow) {
  const sc = currentScore(t);
  const ch = sc && T.champions[sc.champion];
  const cz = T.run.code_zero;
  const callsSoFar = S.works.filter(w => w.ref.type === "call" && w.t0 <= t).length;
  const tried = [...S.cards.values()].filter(c => c.segs.length && c.segs[0].t0 <= t).length;
  const kept = [...S.cards.values()].filter(c => c.segs.some(s => s.type === "dock" && s.t0 <= t)).length;
  const html = [
    ["Champion score", ch ? num(ch.score) : "—"],
    ["Progress to optimal", ch ? pct(ch.progress) : "—"],
    ["Generation", gNow ? `${gNow.gen} of ${T.generations.length - 1}` : "—"],
    ["Agent calls", String(callsSoFar)],
    ["Features kept", `${kept} of ${tried}`],
  ].map(([k, v]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
  const board = $("#board");
  if (board.__html !== html) { board.innerHTML = html; board.__html = html; }
  void cz;
}

/* ============================================================ selection */
function isSel(ref) {
  if (!selected || !ref) return false;
  if (selected.type !== ref.type) return false;
  return selected.id === ref.id && (selected.gen === ref.gen);
}
function select(ref) {
  selected = ref;
  showInspector();
  render(now);
}

/* ============================================================ INSPECTOR */
function put(w, ...kids) { w.append(...kids.flat().filter(k => k != null && k !== false)); return w; }
function genAt(t) { const g = S.gens.filter(g => g.t0 <= t + 1e-6).pop(); return g ? g.gen : 0; }

function showInspector() {
  const box = $("#inspector");
  box.innerHTML = "";
  const wrap = el("div", { class: "insp" });
  box.append(wrap);
  box.scrollTop = 0;
  const ref = selected;
  if (selected) wrap.append(el("button", { class: "back", onclick: () => select(null) }, "← Back to this generation"));
  if (!ref) return genPanel(wrap, genAt(now));
  if (ref.type === "call") return callPanel(wrap, IX.calls.get(ref.id), ref.section);
  if (ref.type === "feature") return featurePanel(wrap, IX.feats.get(ref.id));
  if (ref.type === "idea") return ideaPanel(wrap, IX.feats.get(ref.id));
  if (ref.type === "champion") return championPanel(wrap, ref.id);
  if (ref.type === "node") return nodePanel(wrap, ref.node, genAt(now));
  if (ref.type === "inspect") return nodePanel(wrap, "inspect", ref.gen);
  if (ref.type === "library") return nodePanel(wrap, "library", ref.gen);
  if (ref.type === "log") return nodePanel(wrap, "log", ref.gen);
  if (ref.type === "accept") return nodePanel(wrap, "accept", ref.gen);
  if (ref.type === "refit") return nodePanel(wrap, "fit", ref.gen);
  genPanel(wrap, genAt(now));
}

function notePara(text, auto) {
  const d = el("div", { class: "note" + (auto ? " auto" : "") });
  d.append(el("p", { class: "who" }, auto ? "Model summary (unreviewed)" : (T.notes.author ? `What happened, read by ${T.notes.author}` : "What happened")));
  for (const para of String(text).split(/\n\s*\n/)) d.append(el("p", { html: inlineMd(para) }));
  return d;
}

function facts(pairs) {
  const dl = el("dl", { class: "facts" });
  for (const [k, v] of pairs) { if (v == null || v === "") continue; dl.append(el("dt", {}, k), el("dd", { html: v })); }
  return dl;
}

function genPanel(w, gen) {
  const g = IX.gens.get(gen);
  if (!g) return;
  put(w, el("p", { class: "kicker" }, "Generation"), el("h2", {}, gen === 0 ? "Generation 0: Code Zero" : `Generation ${gen}`));
  const n = noteFor("generations", String(gen));
  if (n) put(w, notePara(n));
  if (gen === 0) {
    put(w, facts([["Score", num(T.run.code_zero && T.run.code_zero.score)], ["Library", "empty"]]));
    if (T.notes.run) put(w, el("h3", {}, "The run in brief"), notePara(T.notes.run));
    return;
  }
  const feats = T.features.filter(f => f.gen === gen);
  const calls = T.calls.filter(c => c.gen === gen);
  const before = g.before || {};
  put(w, facts([
    ["Champion", `${esc(before.id || "—")} ${num(before.official)} → <b>${esc(g.champion)} ${num(g.official)}</b>`],
    ["Progress", `${pct((T.champions[before.id] || {}).progress)} → <b>${pct((T.champions[g.champion] || {}).progress)}</b>`],
    ["Agent calls", `${calls.length} (${calls.filter(c => c.role === "researcher").length} Researcher, ${calls.filter(c => c.role === "coder").length} Coder, ${calls.filter(c => c.role === "mutator").length} Mutator)`],
    ["Features", `${feats.length} tried, ${feats.filter(f => f.verdict === "kept").length} kept`],
    ["Real time", g.seconds != null ? `${g.seconds.toFixed(1)} s (agents ${g.phase_seconds?.agents ?? "?"} s, fitting ${g.phase_seconds?.fit ?? "?"} s)` : null],
  ]));
  put(w, el("h3", {}, "Features this generation"));
  put(w, featureList(feats));
  if ((g.console || []).length) {
    put(w, el("h3", {}, "The run's own log for this generation"));
    put(w, el("pre", { class: "raw" }, g.console.join("\n")));
  }
}

function featureList(feats) {
  const ul = el("ul", { class: "list" });
  for (const f of feats) {
    const idea = IX.ideas.get(f.id);
    ul.append(el("li", {},
      el("span", { class: `pill v-${f.verdict}` }, VERDICT[f.verdict] || f.verdict), " ",
      el("button", { class: "link", onclick: () => select({ type: "feature", id: f.id }) }, `${f.name}`),
      el("span", { class: "small" }, ` ${f.id}, ${f.branch === "deep" ? "Researcher's idea" : (f.note || "Mutator")}${f.delta_valid != null ? `, validation ${sgn(f.delta_valid)}` : f.delta_train != null ? `, best probe ${sgn(f.delta_train)}` : ""}`),
      idea ? el("div", { class: "small" }, short(idea.claim, 170)) : null));
  }
  if (!feats.length) ul.append(el("li", { class: "small" }, "None."));
  return ul;
}

function callPanel(w, c, section) {
  if (!c) return;
  const f = c.feature && IX.feats.get(c.feature);
  put(w, el("p", { class: "kicker" }, `Agent call ${c.id}, generation ${c.gen}`));
  put(w, el("h2", {}, `${ROLE[c.role] || c.role}${f ? `: ${f.name}` : ""}${c.kind !== "first" ? ` (${c.kind})` : ""}`));
  const n = noteFor("calls", c.id) || (f && c.kind === "first" ? noteFor("features", f.id) : null);
  if (n) put(w, notePara(n, isAuto(c.id)));
  put(w, facts([
    ["Took", `${c.seconds.toFixed(2)} s`], ["Tokens", `${c.tokens_in ?? "?"} in, ${c.tokens_out ?? "?"} out`],
    ["Settings", `temperature ${c.temperature}, max_tokens ${c.max_tokens}`], ["Ended", esc(c.finish || (c.error ? "error" : "?"))],
    ["Feature", f ? `<a href="#" data-f="${esc(f.id)}">${esc(f.id)} ${esc(f.name)}</a>` : null],
    ["Error", c.error ? esc(c.error) : null],
  ]));
  w.querySelectorAll("a[data-f]").forEach(a => a.onclick = e => { e.preventDefault(); select({ type: "feature", id: a.dataset.f }); });
  const tabs = [["sent", "What it was sent"], ["reply", "What it replied"], ["thinking", "Hidden reasoning"], ["system", "System prompt"]];
  let mode = section ? "sent" : "reply", raw = false;
  const seg = el("div", { class: "seg", role: "group", "aria-label": "Show" });
  const body = el("div", { class: "scrollbox" });
  const rawBox = el("label", { class: "raw-toggle" }, el("input", { type: "checkbox", onchange: e => { raw = e.target.checked; draw(); } }), " exact text");
  for (const [k, label] of tabs) {
    const b = el("button", { "aria-pressed": String(k === mode) }, label);
    b.onclick = () => { mode = k; [...seg.children].forEach(x => x.setAttribute("aria-pressed", String(x === b))); draw(); };
    seg.append(b);
  }
  put(w, seg, rawBox, body);
  function draw() {
    body.innerHTML = "";
    let text;
    if (mode === "sent") text = c.user;
    else if (mode === "reply") text = c.reply ?? `(no reply: ${c.error || "nothing came back"})`;
    else if (mode === "system") text = T.prompts[c.system] || "";
    else text = c.reasoning || "";
    if (mode === "thinking" && !text) {
      body.append(el("p", { class: "small" }, "None. This run sent reasoning_effort: none, which switches the model's hidden thinking off, so what you see under “What it replied” is all the reasoning there is."));
      return;
    }
    body.append(raw ? el("pre", { class: "raw" }, text) : md(text, mode === "sent" ? section : null));
    if (mode === "sent" && section && !raw) {
      const hit = body.querySelector("h4.hit");
      if (hit) setTimeout(() => { body.scrollTop = hit.offsetTop - body.offsetTop - 6; }, 30);
    }
  }
  draw();
}

function probeChart(f) {
  if (!f.probe || !f.probe.length) return null;
  const pts = [...f.probe].sort((a, b) => a.w - b.w);
  const W = 300, H = 92, pad = 26;
  const vals = pts.map(p => p.delta);
  const lo = Math.min(-0.5, ...vals.map(v => Math.max(v, -3))), hi = Math.max(0.5, ...vals);
  const y = v => pad / 2 + (H - pad) * (1 - (clamp(v, lo, hi) - lo) / (hi - lo));
  const bw = (W - 40) / pts.length;
  const svg = sv("svg", { class: "probe", viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Probe results by weight" });
  svg.append(sv("line", { x1: 30, x2: W, y1: y(0), y2: y(0), stroke: "var(--ink-3)", "stroke-width": 1 }));
  svg.append(sv("text", { x: 0, y: y(0) + 4, style: "font:500 10px var(--font);fill:var(--ink-2)" }, "0"));
  pts.forEach((p, i) => {
    const x = 36 + i * bw, y0 = y(0), y1 = y(p.delta);
    const good = p.delta > 0;
    svg.append(sv("rect", { x, y: Math.min(y0, y1), width: bw - 10, height: Math.max(1.5, Math.abs(y1 - y0)), fill: good ? "var(--fit)" : "var(--bad)", opacity: 0.85 }));
    svg.append(sv("text", { x: x + (bw - 10) / 2, y: H - 2, "text-anchor": "middle", style: "font:500 10px var(--font);fill:var(--ink-2)" }, `w ${p.w > 0 ? "+" : "−"}${Math.abs(p.w)}`));
    svg.append(sv("text", { x: x + (bw - 10) / 2, y: (good ? y1 - 3 : Math.max(y1, y0) + 11), "text-anchor": "middle", style: "font:600 10px var(--font);fill:var(--ink)" }, (p.delta < -3 ? "≪ " : "") + sgn(p.delta, 2)));
  });
  return svg;
}

function featurePanel(w, f) {
  if (!f) return;
  const idea = IX.ideas.get(f.id);
  put(w, el("p", { class: "kicker" }, `Feature ${f.id}, generation ${f.gen}, ${f.branch === "deep" ? "deep loop (Researcher → Coder)" : "wide loop (Mutator)"}`));
  put(w, el("h2", {}, f.name), el("span", { class: `pill v-${f.verdict}` }, VERDICT[f.verdict] || f.verdict),
    f.retired_at != null ? el("span", {}, " ", el("span", { class: "pill v-retired" }, `retired in generation ${f.retired_at}`)) : null);
  const n = noteFor("features", f.id);
  if (n) put(w, notePara(n, isAuto(f.id)));
  if (idea) {
    put(w, el("h3", {}, "The Researcher's idea"));
    put(w, facts([["Saw", esc(idea.claim)], ["Measure", esc(idea.measure)], ["Expected", esc(idea.target)], ["Builds on", esc(idea.builds_on || "")]]));
  } else {
    put(w, el("h3", {}, "What the Mutator was asked"));
    put(w, el("p", {}, f.note === "fresh" ? "A fresh feature: a measurement none of the policy's features captures." : `A ${f.note || "variant"}, keeping what it measures but changing how.`),
      f.description ? el("p", { class: "small" }, `Its docstring: ${f.description}`) : null);
  }
  put(w, el("h3", {}, "How Fit judged it"));
  const t = f.timing || {};
  put(w, facts([
    ["Probe", f.probe ? "the feature alone on top of the champion, at four weights" : null],

/* ---------- text rendering */
function inlineMd(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(“"])\*([^*\n]+?)\*(?=[\s).,;:!?”"]|$)/g, "$1<i>$2</i>");
}
function md(text, highlight) {
  const box = el("div", { class: "md" });
  const re = /```([\w+-]*)[ \t]*\n([\s\S]*?)```/g;
  let last = 0, m;
  const prose = chunk => {
    const lines = chunk.split("\n");
    let para = [], list = null;
    const flush = () => { if (para.length) box.append(el("p", { html: inlineMd(para.join(" ")) })); para = []; };
    for (const ln of lines) {
      const hm = ln.match(/^#{1,6}\s+(.*)/);
      if (hm) {
        flush(); list = null;
        const h4 = el("h4", { html: inlineMd(hm[1]) });
        if (highlight && hm[1].toLowerCase().includes(highlight.toLowerCase())) h4.classList.add("hit");
        box.append(h4);
      } else if (/^\s*[-*]\s+/.test(ln)) {
        flush(); if (!list) { list = el("ul"); box.append(list); }
        list.append(el("li", { html: inlineMd(ln.replace(/^\s*[-*]\s+/, "")) }));
      } else if (!ln.trim()) { flush(); list = null; }
      else if (list && /^\s{2,}/.test(ln)) { list.lastChild.innerHTML += "<br>" + inlineMd(ln.trim()); }
      else { list = null; para.push(ln); }
    }
    flush();
  };
  while ((m = re.exec(text))) { prose(text.slice(last, m.index)); box.append(codeBlock(m[2], m[1])); last = re.lastIndex; }
  prose(text.slice(last));
  return box;
}
const PY_KW = new Set("False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
function highlightPy(src) {
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?(?:e[-+]?\d+)?\b)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += `<span class="tk-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tk-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-num">${esc(m[3])}</span>`;
    else if (m[4]) out += PY_KW.has(m[4]) ? `<span class="tk-kw">${m[4]}</span>` : `<span class="tk-fn">${esc(m[4])}</span>`;
    else out += PY_KW.has(m[5]) ? `<span class="tk-kw">${m[5]}</span>` : esc(m[5]);
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeBlock(code, lang = "python") {
  const pre = el("pre");
  if (!lang || lang === "python" || lang === "py") pre.innerHTML = highlightPy(code);
  else pre.textContent = code;
  return pre;
}
function diffLines(a, b) {
  const A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { out.push([" ", A[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(["-", A[i++]]); else out.push(["+", B[j++]]); }
  while (i < n) out.push(["-", A[i++]]); while (j < m) out.push(["+", B[j++]]);
  return out;
}
function diffBlock(a, b) {
  const pre = el("pre", { class: "diff" });
  pre.innerHTML = diffLines(a, b).map(([k, s]) => k === "+" ? `<span class="add">+ ${highlightPy(s)}</span>` : k === "-" ? `<span class="del">- ${esc(s)}</span>` : `  ${highlightPy(s)}`).join("\n");
  return pre;
}

  // chart: progress by generation
  const gens = T.generations;
  const W = 760, H = 220, L = 46, R = 56, Tp = 22, B = 30;
  const prog = gens.map(g => (T.champions[g.champion] || {}).progress ?? 0);
  const ymax = Math.max(10, Math.ceil(Math.max(...prog) / 10) * 10);

  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Progress to optimal by generation" });
  for (let p = 0; p <= ymax; p += 10) { svg.append(sv("line", { x1: L, x2: W - R, y1: y(p), y2: y(p), stroke: "#E3E7EA" }), sv("text", { x: L - 8, y: y(p) + 4, "text-anchor": "end", style: "font:500 11px var(--font);fill:var(--ink-2)" }, `${p}%`)); }
  let d = "";

function buildTrack() {
  const tr = $("#track");
  tr.innerHTML = "";
  tr.append(el("div", { class: "lane" }));
  for (const g of S.gens) {
    const narrow = (g.t1 - g.t0) / S.end < 0.08;
    const label = g.gen === 0 ? "" : (narrow ? `G${g.gen}` : `Generation ${g.gen}`);
    const s = el("div", { class: "gseg", style: `left:${100 * g.t0 / S.end}%;width:${100 * (g.t1 - g.t0) / S.end}%` }, el("span", { "data-short": g.gen === 0 ? "" : `G${g.gen}` }, label));
    tr.append(s);
  }
  for (const w of S.works) if (w.ref.type === "call") {
    const c = IX.calls.get(w.ref.id);
    tr.append(el("div", { class: `tick ${c && c.branch === "wide" ? "wide" : "deep"}`, style: `left:${100 * w.t0 / S.end}%` }));
  }
  for (const [, c] of S.cards) { const d = c.segs.find(s => s.type === "dock"); if (d) tr.append(el("div", { class: "kept", style: `left:${100 * d.t0 / S.end}%`, title: `${c.f.name} kept` })); }
  tr.append(el("div", { class: "done", id: "done" }), el("div", { class: "head", id: "head" }));
  const seekFrom = e => { const r = tr.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width, 0, 1) * S.end); };
  let drag = false;
  tr.onpointerdown = e => { drag = true; tr.setPointerCapture(e.pointerId); seekFrom(e); };
  tr.onpointermove = e => { if (drag) seekFrom(e); };
  tr.onpointerup = () => { drag = false; };
  tr.onkeydown = e => { if (e.key === "ArrowRight") { step(1); e.preventDefault(); } if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); } };
}
function updateTrack(t) {
  const p = S.end ? 100 * t / S.end : 0;

  $("#gens").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.g === g));
}
function buildGenButtons() {
  const box = $("#gens");
  box.innerHTML = "";
  for (const g of S.gens) box.append(el("button", { "data-g": g.gen, title: g.gen === 0 ? "Code Zero" : `Generation ${g.gen}`, onclick: () => { seek(g.t0 + 0.001); setPlaying(true); } }, g.gen === 0 ? "G0" : `G${g.gen}`));
}
let lastGen = null;
function seek(t) {
  now = clamp(t, 0, S.end);
  render(now);
  const g = genAt(now);
  if (g !== lastGen) { lastGen = g; if (!selected) showInspector(); }
}
function step(dir) {
  setPlaying(false);
  const beats = S.beats;
  if (dir > 0) { const b = beats.find(x => x > now + 0.02); seek(b != null ? b + 0.35 : S.end); }
  else { const b = [...beats].reverse().find(x => x < now - 0.4); seek(b != null ? b + 0.35 : 0); }
}
function setPlaying(p) {
  if (!S) return;
  if (p && now >= S.end - 0.01) seek(0);
  playing = p;
  $("#play").textContent = p ? "Pause" : "Play";
  lastFrame = null;
  if (p) requestAnimationFrame(tick);
}
function tick(ts) {
  if (!playing) return;
  if (lastFrame != null) {
    const dt = Math.min(0.1, (ts - lastFrame) / 1000);
    seek(now + dt * speed);
    if (now >= S.end) { setPlaying(false); return; }
  }
  lastFrame = ts;
  requestAnimationFrame(tick);
}
$("#play").onclick = () => setPlaying(!playing);
$("#next").onclick = () => step(1);
$("#prev").onclick = () => step(-1);
$("#speed").onchange = e => { speed = +e.target.value; };
document.addEventListener("keydown", e => {
  if (!S || e.target.closest("input, select, textarea")) return;
  if (e.key === " " && !e.target.closest("button")) { setPlaying(!playing); e.preventDefault(); }
  else if (e.key === "ArrowRight" && e.target === document.body) { step(1); e.preventDefault(); }
  else if (e.key === "ArrowLeft" && e.target === document.body) { step(-1); e.preventDefault(); }
  else if (e.key === "Escape") select(null);
});
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== b.dataset.view);
});

/* ---------- loading a trace file */
function readFile(file) {
  const r = new FileReader();
  r.onload = () => { try { load(JSON.parse(r.result)); } catch (err) { alert("Couldn't read that file as JSON: " + err.message); } };
  r.readAsText(file);
}
const stage = $("#stage");
stage.addEventListener("dragover", e => { e.preventDefault(); $("#dropzone").hidden = false; $("#dropzone").classList.add("over"); });
stage.addEventListener("dragleave", e => { if (!stage.contains(e.relatedTarget)) { $("#dropzone").classList.remove("over"); if (T) $("#dropzone").hidden = true; } });
stage.addEventListener("drop", e => { e.preventDefault(); $("#dropzone").classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) readFile(f); });
$("#filepick").onchange = e => { const f = e.target.files[0]; if (f) readFile(f); };

if (EMBEDDED_TRACE) load(EMBEDDED_TRACE);
else { $("#dropzone").hidden = false; $("#inspector").innerHTML = '<div class="insp"><h2>No run loaded</h2><p class="meta">Drop a trace file on the floor, or open a page built by viz/export.py.</p></div>'; }
</script>
</body>
